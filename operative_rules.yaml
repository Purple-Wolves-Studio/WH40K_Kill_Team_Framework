rules: # List of operative rules
  # --- Absolution Through Destruction ---
  - id: op_rule_absolution_through_destruction_3
    name: Absolution Through Destruction
    type: 
    text: >
      Whenever this operative performs the Fight action, if it isn't incapacitated, 
      it can immediately perform a free Fight action afterwards.
    points:
      - text: >
          This takes precedence over action restrictions, and you cannot 
          perform more than two Fight actions in succession as a result 
          of this rule.
      - text: >
          If this operative is benefitting from the effects of the 
          Whip Into Frenzy action (see Exactor), this applies to each 
          of the Fight actions from those effects.
  
  # --- Accusing Exorcist ---
  - id: op_rule_accusing_exorcist_3
    name: Accusing Exorcist
    type: 
    text: >
      Whenever this operative is Inspiring, the Suspect & Eliminate 
      strategy ploy costs you 0CP if the enemy operative or marker 
      you select is visible to or within 6" of this operative.
    points: []
  
  # --- Accursed Mutant ---
  - id: op_rule_accursed_mutant_3
    name: Accursed Mutant
    type: 
    text: >
      This operative cannot perform unique actions. You must spend 1 additional 
      AP for this operative to perform the Pick Up Marker and mission actions 
      (excluding Operate Hatch).
    points: []
  
  # --- Accursed Torment ---
  - id: op_rule_accursed_torment_3
    name: Accursed Torment
    type: 
    text: > # String: Using '>' allows for multi-line descriptions
      This operative cannot use any weapons that aren't on 
      its datacard, or perform the Pick Up Marker, unique or 
      mission actions (excluding Operate Hatch).
    points: []
  
  # --- Achillian Eye ---
  - id: op_rule_achillian_eye_3
    name: Achillian Eye
    type: 
    text: >
      Whenever a friendly Battleclade operative is shooting 
      an enemy operative visible to this operative, that 
      friendly operative's ranged weapons have the Saturate 
      weapon rule. This rule has no effect if this operative 
      is within control range of an enemy operative.
    points: []
  
  # --- Adaptable Armoury ---
  - id: op_rule_adaptable_armoury_3
    name: Adaptable Armoury
    type: 
    text: >
      You can select one additional equipment option.
    points: []
  
  # --- Adaptive Equipment ---
  - id: op_rule_adaptive_equipment_3
    name: Adaptive Equipment
    type: 
    text: >
      You can do each of the following once per turning point, one friendly Scout Squad Warrior 
      operative can perform the Smoke Grenade action and one friendly Scout Squad Warrior 
      operative can perform the Stun Grenade action. The rules for these actions are found in 
      universal equipment. Performing these actions using this rule doesn't count towards their 
      action limits (i.e. if you also select those grenades from equipment).
    points: []
  
  # --- Adaptive Swordsmanship ---
  - id: op_rule_adaptive_swordsmanship_3
    name: Adaptive Swordsmanship
    type: 
    text: >
      You can ignore any changes to the Hit stat of this operative's 
      xenophase blade. Whenever this operative is fighting or retaliating, 
      you can resolve one of your successes before the normal order. 
      If you do, that success must be used to block.
    points: []
  
  # --- Advanced Omni-Scrambler ---
  - id: op_rule_advanced_omni-scrambler_3
    name: Advanced Omni-Scrambler
    type: Strategic Gambit
    text: >
      Select one enemy operative visible to or within 6" of this operative, 
      then roll one D6. In the Firefight phase of this turning point, that 
      enemy operative cannot be activated or perform actions until one of 
      the following is true:
    points:
      - text: >
          Your opponent has activated a number of enemy operatives 
          equal to the result of the D6.
      - text: >
          It's the last enemy operative to be activated.
  
  # --- Aggressive Force ---
  - id: op_rule_aggressive_force_3
    name: Aggressive Force
    type: 
    text: >
      Whenever this operative is fighting or retaliating, Normal 
      and Critical Dmg of 3 or more inflicts 1 less damage on it. 
    points:
      - text: >
          This isn't cumulative with the Shield that 
          Slays strategy ploy.
  
  # --- Analyse ---
  - id: op_rule_analyse_3
    name: Analyse
    type: 
    text: >
      Whenever this operative performs the Markerlight action, each other enemy operative 
      that's both visible to this operative and within 3" of the enemy operative you selected for that 
      action also gains one of your Markerlight tokens.
    points: []

  # --- Apprentek Assistance ---
  - id: op_rule_apprentek_assistance_3
    name: Apprentek Assistance
    type: 
    text: >
      This operative has the same unique actions as your Cryptek operative 
      selected for the battle, but can only perform one Cryptek unique action 
      per turning point.
    points: []
  
  # --- Armoured Up ---
  - id: op_rule_armoured_up_3
    name: Armoured Up
    type: 
    text: >
      Whenever an enemy operative is shooting this operative, or this operative is 
      fighting or retaliating, your opponent cannot retain attack dice results of less than 
      6 as critical successes (e.g. as a result of the Lethal, Rending or Severe weapon rules).
    points: []
  
  # --- Astartes ---
  - id: op_rule_astartes_3
    name: Astartes
    type: 
    text: >
       During this operative's activation, it can perform either two Shoot actions or two 
       Fight actions. If it's two Shoot actions, an Astartes shotgun, bolt pistol or boltgun 
       must be selected for at least one of them. This operative can counteract regardless 
       of its order.
    points: []

  # --- Attuned In Purpose ---
  - id: op_rule_attuned_in_purpose_3
    name: Attuned In Purpose
    type: 
    text: >
      Whenever this operative is activated, you can activate another ready 
      friendly Blessed Blade operative within 6" of it at the same time. 
      Complete their activations action by action in any order.
    points: []
  
  # --- Auspex Triangulation ---
  - id: op_rule_auspex_triangulation_3
    name: Auspex Triangulation
    type: 
    text: >
      The Advanced Auspex Scan firefight ploy costs you 0CP when both of 
      the following are true:
    points:
      - text: >
          This operative isn't within control range of enemy operatives.
      - text: >
          The target of that Shoot action (primary target, if relevant) 
          is visible to this operative.
      - text: >
          Note that it doesn't have to be this operative performing the 
          Shoot action, and that any subsequent Shoot actions during that 
          activation/counteraction must meet these same requirements (or that 
          ploy has no effect on those subsequent Shoot actions).
  
  # --- Bad-tempered ---
  - id: op_rule_bad_tempered_3
    name: Bad-tempered
    type: 
    text: >
      Whenever an enemy operative performs the Fight action, if this operative is a valid 
      operative to fight against, you can force them to select this operative to fight 
      against instead. Whenever an enemy operative ends the Charge action within control 
      range of another friendly Farstalker Kinband operative within 3" of this operative, 
      if this operative isn't within control range of enemy operatives, this operative 
      can immediately perform a free Charge action, but must end that move within 
      control range of that enemy operative.
    points: []

  # --- Balefire ---
  - id: op_rule_balefire_3
    name: Balefire
    type: 
    text: >
      Whenever a friendly MAndrake operative is shooting an enemy operative 
      that has one of your Balefire tokens, add 1 to both Dmg stats of that 
      friendly operative's ranged weapons, and those weapons have the Saturate 
      weapon rule. Whenever an operative is shooting a friendly Mandrake operative 
      that has one of your Balefire tokens, subtract 1 from both Dmg stats of 
      that operative's ranged weapons (to a minimum of 1).
    points: []
  
  # --- Banshee Mask ---
  - id: op_rule_banshee_mask_3
    name: Banshee Mask
    type: 
    text: >
      Whenever this operative is fighting, worsen the Hit stat of the enemy 
      operative's melee weapons by 1. This isn't cumulative with being injured.
    points: []

  # --- Beast ---
  - id: op_rule_beast_3
    name: Beast
    type: 
    text: >
      This operative cannot perform any actions other than Charge, Dash, 
      Fall Back, Fight, Gather, Guard, Reposition, Pick Up Marker and Place Marker. 
      It cannot use any weapons that aren't on its datacard.
    points: []
  
  # --- Beast (Drakolithe) ---
  - id: op_rule_beast_drakolithe_3
    name: Beast (Drakolithe)
    type: 
    text: >
      This operative cannot perform any actions other than Charge, Dash, 
      Fall Back, Fight, Guard, Pick Up Marker, Place Marker, Reposition, 
      and mission actions.
    points:
      - text: >
          This operative cannot perform the Pick Up Marker, Place Marker 
          or mission actions unless there's a friendly Leystalker operative 
          that isn't incapacitated.
      - text: >
          It cannot use any weapons that aren't on its datacard.

  # --- Berserker ---
  - id: op_rule_berserker_3
    name: Berserker
    type: 
    text: >
       This operative cannot perform the Shoot action (other than 
       Guard, but cannot then perform a free Shoot action during 
       the interruption). You must spend 1 additional AP for this 
       operative to perform the Pick Up Marker and mission actions 
       (excluding Operate Hatch).
    points: []
  
  # --- Bladed Stance ---
  - id: op_rule_bladed_stance_3
    name: Bladed Stance
    type: 
    text: >
      Whenever this operative is fighting or retaliating, you can 
      resolve one of your successes before the normal order. If 
      you do, that success must be used to block.
    points: []

  # --- Blademaster ---
  - id: op_rule_blademaster_3
    name: Blademaster
    type: 
    text: >
      This operative can perform the Dash action during an activation in which it performed 
      the Charge action, but can only use any remaining move distance it had from that Charge action 
      (to a maximum of 3").
    points: []

  # --- Blade Whirl ---
  - id: op_rule_blade_whirl_3
    name: Blade Whirl
    type: 
    text: >
      Whenever this operative is fighting or retaliating, 
      if it doesn't have one of your Frenzy tokens, you 
      can resolve one of your successes before the normal order. 
      If you do, that success must be used to block.
    points: []
  
  # --- Bladed Stance ---
  - id: op_rule_bladed_stance_3
    name: Bladed Stance
    type: 
    text: >
      Whenever this operative is fighting or retaliating, you can resolve one of your 
      successes before the normal order. If you do, that success must be used to block.
    points: []

  # --- Blink Pack ---
  - id: op_rule_blink_pack_3
    name: Blink Pack
    type: 
    text: >
      Whenever this operative performs the Charge, Fall Back or Reposition action, it can 
      warp jump. If it does, don't move it. Instead, remove it from the killzone and set it back up 
      wholly within 7" horizontally of its original location (in Killzone: Gallowdark, this distance 
      can be measured through Wall terrain). It must be set up in a location it can be placed, and unless 
      it's the Charge action, it cannot be set up within control range of an enemy operative. This operative 
      cannot warp jump during the same activation in which it performed the Dash action (or vice versa).
    points: []

  # --- Boom! ---
  - id: op_rule_boom_3
    name: Boom!
    type: 
    text: >
      If this operative is incapacitated during a battle in which it 
      hasn't used its explosives, roll one D6, or two D6 if you wish. If any result 
      is a 4+, this operative performs a free Shoot action with its explosives 
      before it's removed from the killzone.
    points: []

  # --- Boons of Damnation ---
  - id: op_rule_boons_of_damnation_3
    name: Boons of Damnation
    type: 
    text: >
      Boons of Damnation are as follows (resolved with a D6 roll, see opposite):
    points:
      - text: >
          When an attack dice inflicts damage of 3 or more on this operative, 
          you can ignore an amount of damage equal to this operative's 
          Damnation points.
      - text: >
          When this operative is fighting or retaliating and you strike with 
          an attack dice, you can inflict an amount of additional damage equal 
          to this operative's Damnation points.
  
  # --- Brawler ---
  - id: op_rule_brawler_3
    name: Brawler
    type: 
    text: >
      Whenever this operative is fighting or retaliating; enemy operatives cannot assist. 
      If it's incapacitated, you can strike the enemy operative in that sequence with one of your 
      unresolved successes before it's removed from the killzone.
    points: []

  # --- Brazen Killer ---
  - id: op_rule_brazen_killer_3
    name: Brazen Killer
    type: 
    text: >
      Whenever this operative incapacitates an enemy operative with its 
      wroughtlock revolvers, roll one D6 separately for each other enemy operative 
      visible to and within 2" of that enemy operative: if the result is higher 
      than that other enemy operative's APL stat, subtract 1 from its APL stat 
      until the end of its next activation.
    points: []
  
  # --- Breachwall ---
  - id: op_rule_breachwall_3
    name: Breachwall
    type: 
    text: >
      Whenever your opponent is selecting a valid target, and this operative 
      has an Engage order and is intervening,they cannot select another 
      friendly Imperial Navy Breacher operative whose base is touching 
      this operative's. 
    points: # List: Strings for additional info
      - text: >
          This rule has no effect if more than one other friendly 
          operative's base is touching this operative's.
  
  # --- Brutal Assault ---
  - id: op_rule_brutal_assault_3
    name: Brutal Assault
    type: 
    text: >
      Whenever this operative is fighting, its heavy thunder hammer has 
      the Brutal weapon rule. Whenever this operative performs the Charge 
      action, its heavy thunder hammer has the Ceaseless weapon rule until 
      the end of the activation/counteraction.
    points: []
  
  # --- Brute ---
  - id: op_rule_brute_3
    name: Brute
    type: 
    text: >
      Whenever your opponent is selecting a valid target, if this operative 
      has a Conceal order, it cannot use Light terrain for cover. While this 
      can allow this operative to be targeted (assuming it's visible), it 
      doesn't remove its cover save (if any).
    points: []
  
  # --- Brutish ---
  - id: op_rule_brutish_3
    name: Brutish
    type: 
    text: >
      Whenever an attack dice would inflict Critical Dmg on this operative, 
      you can choose for that attack dice to inflict Normal Dmg instead.
    points: []
  
  # --- Call the Attack ---
  - id: op_rule_call_the_attack_3
    name: Call the Attack
    type: Strategic Gambit
    text: >
      If this operative doesn't have one of your Frenzy tokens. 
      Select one friendly Fellgor Ravager operative visible to 
      and within 6" of this operative. That selected operative, 
      and each other friendly Fellgor Ravager operative visible 
      to and within 2" of it, can immediately perform a free Dash 
      action in an order of your choice.
    points: []
  
  # --- Call The Kill ---
  - id: op_rule_call_the_kill_3
    name: Call The Kill
    type: Strategic Gambit
    text: >
      Select one enemy operative to be your mark for the turning point. 
      Whenever a friendly FARSTALKER KINBAND operative is shooting against, fighting against or 
      retaliating against your mark, that friendly operative's weapons have the Balanced weapon rule. 
      Whenever your mark is incapacitated, you can select a new enemy operative to be your mark for 
      the turning point (and can continue to do so during this turning point).
    points: []

  # --- Camouflaged ---
  - id: op_rule_camouflaged_3
    name: Camouflaged
    type: 
    text: >
      Whenever an operative is shooting this operative, ignore the Piercing weapon rule 
      and all cover saves are retained as critical successes. This rule has no effect if this operative 
      isn't selected as the valid target, e.g. if it's a secondary target from the Blast weapon rule.
    points: []

  # --- Camo Cloak ---
  - id: op_rule_camo_cloak_3
    name: Camo Cloak
    type: 
    text: >
      Whenever an operative is shooting this operative, ignore the Saturate weapon rule, 
      and if you can retain any cover saves, you can retain one additional cover save, or you can 
      retain one cover save as a critical success instead. This isn't cumulative with improved cover 
      saves from Vantage terrain.
    points: []

  # --- Cast the Runes ---
  - id: op_rule_cast_the_runes_3
    name: Cast the Runes
    type: 
    text: >
      After selecting this operative, before the battle, roll three D6 
      and put them to one side.
    points:
      - text: >
          For each result of 1-4, you can use the Command Re-roll firefight 
          ploy for OCP once during the turning point that matches the result.
      - text: >
          If one or more results are 5-6, you gain 1CP.
      - text: >
          For example, if you roll 2, 2 and 5, you gain 1CP and twice during 
          the second turning point you can use Command Re-roll for 0CP.
  
  # --- Caustic Demise ---
  - id: op_rule_caustic_demise_3
    name: Caustic Demise
    type: 
    text: >
      When this operative is incapacitated, before it's removed from the killzone, 
      roll one D6 separately for each enemy operative visible to and within 2" of it.
    points:
      - text: >
          On a 4+, inflict 1 damage on that operative.
  
  # --- Champion ---
  - id: op_rule_champion_3
    name: Champion
    type: 
    text: >
      This operative can perform two Fight 
      actions during its activation.
    points: []
  
  # --- Chaos Champion ---
  - id: op_rule_chaos_champion_3
    name: Chaos Champion
    type: Strategic Gambit
    text: >
      Remove your Challenge token from the enemy operative that has it (if any), 
      then select one enemy operative to gain your Challenge token. Whenever this 
      operative is fighting against or retaliating against an enemy operative that 
      has your Challenge token, in the Select Weapons step, you can select one of 
      the following weapon rules for this operative's melee weapons to have until 
      the end of the sequence: Balanced, Brutal, Punishing, Severe, Shock.
    points: []
  
  # --- Claim Skull ---
  - id: op_rule_claim_skull_3
    name: Claim Skull
    type: 
    text: >
      Once per turning point, if this operative incapacitates an 
      enemy operative with its great chainaxe, you gain 1CP.
    points: []
  
  # --- Clanblade Upgrades ---
  - id: op_rule_clanblade_upgrades_3
    name: Clanblade Upgrades
    type: 
    text: >
      When this operative is selected for the battle, select up to 
      two different Clanblade Upgrade rules (see Faction Rules) to 
      be added to its datacard for the battle.
    points: []
  
  # --- Clandestine Headtaker ---
  - id: op_rule_clandestine_headtaker_3
    name: Clandestine Headtaker
    type: 
    text: >
      This operative can perform the Charge action while it has a Conceal order. 
      Whenever this operative is fighting against an operative it wasn't visible 
      to at the start of the activation/counteraction, the first time you strike 
      during that sequence, you can immediately resolve another of your successes 
      as a strike (before your opponent).
    points: []
  
  # --- Climbing Picks ---
  - id: op_rule_climbing_picks_3
    name: Climbing Picks
    type: 
    text: >
      Whenever this operative is climbing up, you can treat the 
      vertical distance as 2" (regardless of how far the operative 
      actually moves vertically).
    points: []
  
  # --- Cold-blooded ---
  - id: op_rule_cold_blooded_3
    name: Cold-blooded
    type: 
    text: >
      Whenever this operative is shooting against, fighting against 
      or retaliating against a wounded enemy operative, this operative's weapons 
      have the Lethal 5+ weapon rule; if that enemy operative is also injured, 
      this operative's weapons also have the Rending weapon rule.
    points: []

  # --- Command Breach ---
  - id: op_rule_command_breach_3
    name: Command Breach
    type: 
    text: >
      Whenever you would use the Attack Order or Defence Order strategy ploy, 
      if this operative is in the killzone, it costs you 0CP. Once during each 
      of this operative's activations, before or after it performs an action, 
      if your Attack Order or Defence Order marker is in the killzone (see relevant 
      strategy ploy), you can either:
    points: # List: Strings for additional info
      - text: >
          Remove that marker and place it again.
      - text: >
          Change the selected ploy to the other (e.g. your Attack Order 
          becomes a Defence Order).
      - text: >
          You cannot do both, and you don't need to spend any CP to 
          change the ploy.
  
  # --- Commune ---
  - id: op_rule_commune_3
    name: Commune
    type: 
    text: >
      When selecting your operatives for the battle, also select one Vespid Stingwing strategy ploy.
      Whenever this operative is in the killzone and not within control range of enemy operatives, 
      that ploy costs 0 CP.
    points: []

  # --- Communion Helm ---
  - id: op_rule_communion_helm_3
    name: Communion Helm
    type: 
    text: >
      Once during each of this operative's activations, you can spend 1 Communion point for free.
    points: []
  
  # --- Covert Protocols ---
  - id: op_rule_covert_protocols_3
    name: Covert Protocols
    type: 
    text: >
      This operative can counteract regardless of its order, but if it has a Conceal order 
      during that counteraction, it cannot perform any actions other than Pick Up Marker, 
      Place Marker or mission actions.
    points: []

  # --- Cut Them Down ---
  - id: op_rule_cut_them_down_3
    name: Cut Them Down
    type: 
    text: >
      Whenever an enemy operative performs the Fall Back action while within 
      control range of this operative, you can use this rule. If you do, inflict 
      D3+1 damage on that enemy operative before it moves. If that enemy operative 
      is within control range of two of these operatives, inflict 2D3+2 damage instead.
    points: []
  
  # --- Daemonic ---
  - id: op_rule_daemonic_3
    name: Daemonic
    type: 
    text: >
      Whenever an operative is shooting this operative, 
      ignore the Piercing weapon rule.
    points: []
  
  # --- Dat All You Got? ---
  - id: op_rule_dat_all_you_got_3
    name: Dat All You Got?
    type: 
    text: >
      After this operative fights or retaliates, if it wasn't incapacitated, 
      you can inflict D3 damage on the enemy operative in that sequence.
    points: []

  # --- Deathmarked ---
  - id: op_rule_deathmarked_3
    name: Deathmarked
    type: 
    text: >
      Whenever this operative ends the Shoot action, the target gains one of 
      your Deathmarked tokens if it wasn't incapacitated (the primary target, 
      if relevant). Whenever a friendly Hierotek Circle Deathmark operative 
      is shooting an enemy operative that has one of your Deathmarked tokens, 
      that friendly operative's ranged weapons have the Seek weapon rule.
    points: []
  
  # --- Defence Tactics ---
  - id: op_rule_defence_tactics_3
    name: Defence Tactics
    type: 
    text: >
      Whenever this operative contests an objective marker or one of your 
      mission markers, or whenever it's shooting an enemy operative that does, this 
      operative's weapons have the Balanced weapon rule.
    points: []

  # --- Devotion ---
  - id: op_rule_devotion_3
    name: Devotion
    type: 
    text: >
      At the end of each of this operative's activations, if it's 
      Inspiring and it controls an objective marker or one of your 
      mission markers, one friendly Celestian Insidiant operative 
      this operative is visible to and within 6" of becomes Inspiring.
    points: []
  
  # --- Disengage ---
  - id: op_rule_disengage_3
    name: Disengage
    type: 
    text: >
      This operative can perform the Fall Back action for 1 less AP.
    points: []
  
  # --- Divine Acquisition ---
  - id: op_rule_divine_acquisition_3
    name: Divine Acquisition
    type: 
    text: >
      Once per turning point, when this operative performs a mission action 
      that requires it to control an objective or mission marker, you gain 
      a number of Faith points equal to the turning point number.
    points: []
  
  # --- Drone ---
  - id: op_rule_drone_3
    name: Drone
    type: 
    text: >
      This operative can only perform Charge, Dash, Fall Back, Fight, Reposition, and Shoot actions.
      It cannot use any other weapons.
    points:
      - text: >
          When determining control of an objective marker, treat this operative's APL stat as 1 lower.
      - text: >
          When determining what is visible to this operative, the round disc at the top is its head.

  # --- Dynamic ---
  - id: op_rule_dynamic_3
    name: Dynamic
    type: 
    text: >
      Whenever this operative performs the Shoot or Fight action, 
      it can immediately perform a free Dash action afterwards. 
      It can do so even if it's performed the Charge action during 
      this activation, but can only use any remaining move distance 
      it had from that Charge action (to a maximum of 3").
    points: []
  
  # --- Electrochaff Launcher ---
  - id: op_rule_electrochaff_launcher_3
    name: Electrochaff Launcher
    type: 
    text: >
      Once per turning point, when an enemy operative is performing the Shoot action and your opponent 
      selects a valid target (excluding Drone), you can use this rule, providing this operative isn't 
      within control range of enemy operatives. If you do, until the end of that action, whenever an 
      enemy operative is shooting a friendly XV26 Stealth Battlesuit operative that's both visible to 
      and within 3" of this operative and more than 2" from that enemy operative:
    points:
      - text: >
          Ignore the Piercing weapon rule.
      - text: >
          That friendly operative is obscured

  # --- Emboldened ---
  - id: op_rule_emboldened_3
    name: Emboldened
    type: 
    text: >
      Whenever an attack dice inflicts damage of 3 or more on this operative 
      during a turning point in which it performed the Charge action, roll 
      one D6.
    points: # List: Strings for additional info
      - text: >
          On a 5+, subtract 1 from that inflicted damage.
  
  # --- Erudite Hunter ---
  - id: op_rule_erudite_hunter_3
    name: Erudite Hunter
    type: Strategic Gambit
    text: >
      Select one enemy operative within 9" of this operative. 
      Once during this turning point, after that enemy operative performs an action in which 
      it moves during its activation, you can interrupt that activation to use this rule. 
      If you do, this operative can immediately perform either a free Reposition action 
      (it cannot end that move further from that enemy operative), or a free Charge action 
      (you can change its order to do so, and it must end that move within control range of 
      that enemy operative).
    points: []

  # --- Evasive Drone ---
  - id: op_rule_evasive_drone_3
    name: Evasive Drone
    type: 
    text: >
      This operative can only perform Aerial Guidance, Charge, Dash, Fall Back, 
      Fight, and Reposition. When determining control of objective markers, treat this 
      operative's APL stat as 1 lower. When determining what's visible to this operative, 
      the round disc at the top is its head. When this operative has a Conceal order and 
      is in cover, it cannot be selected as a valid target, taking precedence over all 
      other rules. When an operative is shooting this operative, ignore the Piercing weapon rule.
    points: []

  # --- Exarch ---
  - id: op_rule_exarch_3
    name: Exarch
    type: 
    text: >
      This operative can perform two Fight or two Shoot actions during its activation.
    points: []

  # --- Expendable ---
  - id: op_rule_expendable_3
    name: Expendable
    type: 
    text: >
      This operative is ignored for your opponent's kill/elimination op 
      (when it's incapacitated, and when determining your starting number 
      of operatives).
    points: 
      - text: >
          It's ignored for victory conditions that require operatives 
          to 'escape', 'survive', or be incapacitated (if it 
          escapes/survives/is incapacitated, determining how many 
          operatives must escape/survive/be incapacitated, etc.).

  # --- Eye of the Ancestors ---
  - id: op_rule_eye_of_the_ancestors_3
    name: Eye of the Ancestors
    type: Strategic Gambit
    text: >
      Select one enemy operative, or up to two enemy operatives if three 
      or more friendly Hearthkyn Salvager operatives are incapacitated. 
      Each of those enemy operatives gains one of your Grudge tokens.
    points: []

  # --- Faolchu's Bond ---
  - id: op_rule_faolchu_bond_3
    name: Faolchu's Bond
    type: 
    text: >
      The first time during each turning point that this operative is retaliating, 
      if it's ready, in the Resolve Attack Dice step of that sequence, you resolve the first 
      attack dice [i.e. defender instead of attacker].
    points: []

  # --- Fearless on the Frontline ---
  - id: op_rule_fearless_on_the_frontline_3
    name: Fearless on the Frontline
    type: 
    text: >
      This operative can perform the Markerlight action while within control range of an enemy 
      operative, taking precedence over the Markerlight action's normal conditions. In addition, 
      this operative can perform the Fall Back action for 1 less AP.
    points: []
  
  # --- Fierce Temperament ---
  - id: op_rule_fierce_temperament_3
    name: Fierce Temperament
    type: 
    text: >
      Whenever this operative is wholly within your Storm, 
      its weapons have the Severe weapon rule.
    points: []
  
  # --- For the Greater Good ---
  - id: op_rule_for_the_greater_good_3
    name: For the Greater Good
    type: 
    text: >
      Whenever determining the value of Accurate X for the Kauyon faction rule, if this operative 
      is in the killzone, add 1 to the result if 2 or more friendly XV26 Stealth Battlesuit 
      operatives (excluding Drones) are incapacitated (to a maximum of Accurate 3). Note that you 
      must have a minimum of Accurate 1 to use this rule.
    points: []

  # --- Frenzied Attack ---
  - id: op_rule_frenzied_attack_3
    name: Frenzied Attack
    type: 
    text: >
      If this operative is incapacitated during the Fight action, you can 
      strike the enemy operative in that sequence with one of your unresolved 
      successes before this operative is removed from the killzone.
    points: []
  
  # --- Gellercaust Masks ---
  - id: op_rule_gellercaust_masks_3
    name: Gellercaust Masks
    type: 
    text: >
      Whenever an attack dice would inflict Critical Dmg on this operative, 
      you can choose for that attack dice to inflict Normal Dmg instead.
    points: []
  
  # --- Ghost Rig ---
  - id: op_rule_ghost_rig_3
    name: Ghost Rig
    type: 
    text: >
      While this operative has a Conceal order, your opponent cannot select it as a 
      valid target unless it's within 6" of the operative trying to target it. Note that this rule 
      has no effect if this operative isn't selected as the valid target, e.g. if it's a secondary 
      target from the Blast weapon rule.
    points: []
  
  # --- Glorious Hymnal ---
  - id: op_rule_glorious_hymnal_3
    name: Glorious Hymnal
    type: Support
    text: >
      Whenever a friendly Novitiate operative is within 3" of this operative, 
      that friendly operative's weapons have the Severe weapon rule.
    points: []
  
  # --- Grandfather's Blessing ---
  - id: op_rule_grandfathers_blessing_3
    name: Grandfather's Blessing
    type: 
    text: >
      Whenever an enemy operative that has one of your Poison tokens 
      loses one or more wounds within 7" of this operative, this operative 
      regains up to an equal number of lost wounds (to a maximum of 3 lost 
      wounds per turning point, and only if this operative isn't incapacitated).
    points: []
  
  # --- Grapnel Assault ---
  - id: op_rule_grapnel_assault_3
    name: Grapnel Assault
    type: 
    text: >
      Whenever this operative performs the Charge action during its activation, if it climbs, 
      drops, jumps or its base moves underneath Vantage terrain during that action, its melee 
      weapons have the Lethal 3+ weapon rule until the end of that activation.
    points: []
  
  # --- Grapnel Launcher ---
  - id: op_rule_grapnel_launcher_3
    name: Grapnel Launcher
    type: 
    text: >
      Whenever this operative is climbing up, you can treat the vertical distance as 2" 
      (regardless of how far the operative actually moves vertically).
    points: []

  # --- Grav-chute and Grapnel Launcher ---
  - id: op_rule_grav-chute_grapnel_launcher_3
    name: Grav-chute and Grapnel Launcher
    type: 
    text: >
      Whenever this operative is climbing, treat the vertical distance as 2" 
      (regardless of how far the operative actually moves vertically). 
      Whenever this operative is dropping, ignore the vertical distance.
    points: []
  
  # --- Grenadier ---
  - id: op_rule_grenadier_3
    name: Grenadier
    type: 
    text: >
      This operative can use frag, krak, smoke and stun grenades 
      (see universal equipment). Doing so doesn't count towards any limited 
      uses you have (i.e. if you also select those grenades from equipment 
      for other operatives). Whenever this operative is using a frag or krak 
      grenade, improve the Hit stat of that weapon by 1.
    points: []
  
  # --- Grenadier (Imperial Navy Breacher) ---
  - id: op_rule_grenadier_imperial_navy_breacher_3
    name: Grenadier
    type: 
    text: >
      This operative can use frag, krak, and stun grenades 
      (see universal equipment). Doing so doesn't count towards any limited 
      uses you have (i.e. if you also select those grenades from equipment 
      for other operatives). Whenever this operative is using a frag or krak 
      grenade, improve the Hit stat of that weapon by 1.
    points: []
  
  # --- Grenadier (Plague Marine) ---
  - id: op_rule_grenadier_plague_marine_3
    name: Grenadier (Plague Marine)
    type: 
    text: >
      This operative can use blight and krak grenades (see faction 
      and universal equipment). Doing so doesn't count towards any 
      limited uses you have (i.e. if you also select those grenades 
      from equipment for other operatives).
    points:
      - text: > 
          Whenever doing so, improve the Hit stat of that weapon 
          by 1 and blight grenades have the Toxic weapon rule.
      - text: >
          (Toxic) Whenever this operative is using this weapon against 
          an enemy operative that has one of your Poison tokens, add 1 
          to both Dmg stats of this weapon.

  # --- Grizzled Veteran ---
  - id: op_rule_grizzled_veteran_3
    name: Grizzled Veteran
    type: 
    text: >
      The first time this operative would be incapacitated during the battle, 
      it's not incapacitated, has 1 wound remaining and cannot be incapacitated 
      for the remainder of the action.
    points:
      - text: >
          All remaining attack dice are discarded, including yours if this 
          operative is fighting or retaliating.
      - text: >
          You cannot use the Counterattack firefight ploy or inflict damage as 
          a result of the Savage Fighters strategy ploy at the end of that action.
  
  # --- Group Activation (Armsman) ---
  - id: op_rule_group_activation_armsman_3
    name: Group Activation (Armsman)
    type: 
    text: >
      Whenever this operative is expended, you must then activate one other ready friendly 
      Imperial Navy Breacher Armsman operative (if able) before your opponent activates. When that 
      other operative is expended, your opponent then activates as normal.
    points:
      - text: >
          You cannot activate more than two operatives in succession with this rule.
      - text: >
          Ignore this rule when you are using the Breach and Clear faction rule.
  
  # --- Group Activation (Chaos Devotee) ---
  - id: op_rule_group_activation_chaos_devotee_3
    name: Group Activation (Chaos Devotee)
    type: 
    text: >
      Whenever this operative is expended, you must then activate one other ready friendly 
      Chaos Cult Devotee operative (if able) before your opponent activates. When that 
      other operative is expended, your opponent then activates as normal.
    points:
      - text: >
          You cannot activate more than two operatives in succession with this rule.
  
  # --- Group Activation (Glitchling) ---
  - id: op_rule_group_activation_glitchling_3
    name: Group Activation (Glitchling)
    type: 
    text: >
      Whenever this operative is expended, you must then activate one other ready friendly 
      Gellerpox Infected Mutant operative (if able) before your opponent activates. When that 
      other operative is expended, your opponent then activates as normal.
    points:
      - text: >
          You cannot activate more than two operatives in succession with this rule.
  
  # --- Group Activation (Mutant) ---
  - id: op_rule_group_activation_mutant_3
    name: Group Activation (Mutant)
    type: 
    text: >
      Whenever this operative is expended, you must then activate one other ready friendly 
      Gellerpox Infected Mutant operative (if able) before your opponent activates. When that 
      other operative is expended, your opponent then activates as normal.
    points:
      - text: >
          You cannot activate more than two operatives in succession with this rule.
  
  # --- Group Activation (Mutoid Vermin) ---
  - id: op_rule_group_activation_mutoid_vermin_3
    name: Group Activation (Mutoid Vermin)
    type: 
    text: >
      Whenever this operative is expended, you must then activate one other ready friendly 
      Gellerpox Infected Mutoid Vermin operative (if able) before your opponent activates. When that 
      other operative is expended, your opponent then activates as normal.
    points:
      - text: >
          You cannot activate more than two operatives in succession with this rule.
  
  # --- Guidance and Experience ---
  - id: op_rule_guidance_and_experience_3
    name: Guidance and Experience
    type: 
    text: >
      Once during each of this operative's activations, you can select one other friendly Scout Squad
      operative visible to it. Until the end of that operative's next activation, add 1 to its APL stat.
    points: []

  # --- Gunfight ---
  - id: op_rule_gunfight_3
    name: Gunfight
    type: 
    text: >
      Whenever an enemy operative within 8" of this operative shoots this operative, 
      keep track of each attack dice that's discarded as a fail. After the action, 
      before incapacitated operatives are removed (including this one, if relevant), 
      this operative can perform a free Shoot action (you can change its order to 
      Engage to do so), but it can only target that enemy operative with its hot-shot 
      laspistols (focused), and you only roll a number of attack dice equal to the 
      opponent's discarded attack dice plus one (to a maximum of four).
    points: []
  
  # --- Hardy ---
  - id: op_rule_hardy_3
    name: Hardy
    type: 
    text: >
      Whenever an attack dice would inflict Critical Dmg on this operative, 
      you can choose for that attack dice to inflict Normal Dmg instead.
    points: []

  # --- Harrowing Whispers ---
  - id: op_rule_harrowing_whispers_3
    name: Harrowing Whispers
    type: 
    text: >
      Whenever your opponent would activate an enemy operative within 6" 
      of this operative, you can roll one D6.
    points:
      - text: >
          You cannot do so if you already interrupted that operative's 
          activation with this rule or the Dirgemaw operative's Haunting 
          Focus additional rule during this turning point
      - text: >
          If the result is higher than that enemy operative's APL stat, 
          your opponent cannot activate it during this activation.
      - text: >
          If there are no other enemy operatives eligible to be activated, 
          this rule has no effect.
  
  # --- Haunting Focus ---
  - id: op_rule_haunting_focus_3
    name: Haunting Focus
    type: Strategic Gambit
    text: >
      Select one enemy operative. Until the Ready step of the next Strategy phase, 
      it gains your Haunting Focus token. The next time your opponent would activate 
      an enemy operative that has your Haunting Focus token, if this operative is ready, 
      you can activate this operative first. If you do, during that activation, this 
      operative must shoot against or fight against that enemy operative, and cannot 
      do so against any other enemy operatives until it does.
    points:
      - text: >
          You cannot activate the enemy operative if you also rolled to 
          prevent that operative's activation with the Nightfiend operative's 
          Harrowing Whispers additional rule during this turning point.
      - text: >
           If the enemy operative cannot attack its forced target, this 
           operative's activation is cancelled.
      - text: >
          After completing the operative's activation, your opponent activates 
          that enemy operative, if possible, or activates a different enemy 
          operative if they can't.
  
  # --- Haywire Mine ---
  - id: op_rule_haywire_mine_3
    name: Haywire Mine
    type: 
    text: >
      This operative is carrying your Haywire Mine marker. It can perform 
      the Pick Up Marker action on that marker, but that marker cannot be 
      placed within another operative's control range.
    points:
      - text: >
          If this operative is incapacitated while carrying that marker 
          and that marker cannot be placed, it's removed with this operative.
  
  # --- High-intensity Markerlight ---
  - id: op_rule_high_intensity_markerlight_3
    name: High-intensity Markerlight
    type: 
    text: >
      When this operative uses Markerlight, the selected enemy operative gains two Markerlight tokens.
    points: []
  
  # --- Holy Defender ---
  - id: op_rule_holy_defender_3
    name: Holy Defender
    type: 
    text: >
      Once per turning point, when a friendly Celestian Insidiant operative 
      visible to and within 2" of this operative is selected as the valid 
      target of a Shoot action or to fight against during the Fight action, 
      you can use this rule. If you do, this operative becomes the valid 
      target or is fought against instead. 
    points:
      - text: >
          If it's the Shoot action, this operative is only 
          in cover or obscured if the original target was.
      - text: >
          If it's the Fight action, treat this operative as 
          being within the fighting operative's control range 
          for the duration of that action.
      - text: >
          This rule has no effect if it's the Shoot action and the ranged 
          weapon has the Blast or Torrent weapon rule.
  
  # --- Holy Example ---
  - id: op_rule_holy_example_3
    name: Holy Example
    type: 
    text: >
      Once per turning point, if this operative is Inspiring, 
      you can use a firefight ploy for 0CP if this is the specified 
      Celestian Insidiant operative.
    points:
      - text: >
          This includes Command Re-roll if the attack or defence 
          dice was rolled for this operative.
  
  # --- Homing Beacon ---
  - id: op_rule_homing_beacon_3
    name: Homing Beacon
    type: 
    text: >
      This operative is carrying your Homing Beacon marker. Operatives (excluding Drone) can perform 
      the Pick Up Marker action on that marker. The first time an enemy operative performs the 
      Pick Up Marker action on your Homing Beacon marker, discard that marker (remove it from the battle).

      In the Ready step of each Strategy phase, when you gain CP, if your Homing Beacon marker is in the 
      killzone, roll one D6 if it's more than 6" from your drop zone; roll two D6 instead if it's within 
      your opponent's territory; roll three D6 instead if it's within 6" of your opponent's drop zone. 
      If any result is a 4+, you gain one additional CP.
    points: []

  # --- Horrifying Dismemberment ---
  - id: op_rule_horrifying_dismemberment_3
    name: Horrifying Dismemberment
    type: 
    text: >
      Whenever this operative incapacitates an enemy operative while fighting 
      or retaliating, select one other enemy operative visible to and within 
      3" of either this operative or the incapacitated enemy operative.
    points:
      - text: >
          Subtract 1 from that enemy operative's APL stat until the end of 
          its next activation.
  
  # --- Horrifying Shrieking ---
  - id: op_rule_horrifying_shrieking_3
    name: Horrifying Shrieking
    type: 
    text: >
      Whenever an enemy operative is within 3" of this operative, your opponent 
      must spend 1 additional AP for that enemy operative to perform the Pick Up 
      Marker and mission actions. Whenever determining control of a marker, treat 
      the total APL stat of enemy operatives that contest it as 1 lower if at least 
      one of those enemy operatives is within 3" of this operative. Note this isn't 
      a change to the APL stat, so any changes are cumulative with this.
    points: []
  
  # --- Hypersensory Hunter ---
  - id: op_rule_hypersensory_hunter_3
    name: Hypersensory Hunter
    type: 
    text: >
      This operative can perform the Charge action while it has a Conceal order 
      if it performed the Burrow action during the same activation/counteraction.
    points: []
  
  # --- HY-Pex Mines ---
  - id: op_rule_hy_pex_mines_3
    name: HY-Pex Mines
    type: 
    text: >
      Whenever one of your reverse-side down Minefield markers is both within an 
      enemy operative's control range and not within a friendly Hernkyn Yaegir operative's 
      control range, flip the marker over. If it's a blank, there's no effect. If it's a 
      HY-Pex mine, inflict 3 damage on that enemy operative and roll one D6: if the result is 
      less than that enemy operative's Save stat, inflict additional damage on it equal to the 
      dice result; regardless of the result, if it isn't incapacitated, end its action (if any), 
      even if that action's effects aren't fulfilled. If it cannot be placed, move it the minimum 
      amount to do so. Regardless, that marker isn't removed.
    points: []
  
  # --- Icon Bearer ---
  - id: op_rule_icon_bearer_3
    name: Icon Bearer
    type: 
    text: >
      Whenever determining control of a marker, treat this operative's APL 
      stat as 1 higher.
    points:
      - text: >
          This isn't a change to its APL stat, so any changes are 
          cumulative with this.
  
  # --- Icon Bearer (Fellgor Ravager) ---
  - id: op_rule_icon_bearer_fellgor_ravager_3
    name: Icon Bearer (Fellgor Ravager)
    type: 
    text: >
       This operative isn't affected by the marker control 
       bullet point of the Frenzy faction rule. Whenever 
       determining control of a marker, treat this operative's 
       APL stat as 1 higher.
    points:
      - text: >
          This isn't a change to its APL stat, so any changes are 
          cumulative with this.

  # --- Icon of Contagion ---
  - id: op_rule_icon_of_contagion_3
    name: Icon of Contagion
    type: 
    text: >
      Whenever this operative is within your opponent's 
      territory, the Contagion strategy ploy costs you 0CP.
    points: []
  
  # --- I Got a Plan, Ladz ---
  - id: op_rule_i_got_a_plan_ladz_3
    name: I Got a Plan, Ladz
    type: 
    text: >
      Once during each of this operative's activations, it can 
      perform the Pick Up Marker, Place Marker or a mission action for 1 less AP.
    points: []

  # --- Impending Apotheosis ---
  - id: op_rule_impending_apotheosis_3
    name: Impending Apotheosis
    type: 
    text: >
       Once per battle, when an attack dice inflicts Normal Dmg 
       on this operative, you can ignore that inflicted damage.
    points: []
  
  # --- Implacable Darkscale ---
  - id: op_rule_implacable_darkscale_3
    name: Implacable Darkscale
    type: 
    text: >
      You can ignore any changes to this operative's Drakesteed 
      Fangs & Talons weapon's Hit stat from being injured.
    points: []
  
  # --- Incite the Hunt ---
  - id: op_rule_incite_the_hunt_3
    name: Incite the Hunt
    type: 
    text: >
      Whenever this operative incapacitates an enemy operative from 
      more than 2" away, before that enemy operative is removed from 
      the killzone, you can increase the Gore Tank of one friendly 
      Goremonger operative within 8" of that enemy operative.

      Whenever this operative inflicts damage on an enemy operative 
      with either profile of its dual autopistols but doesn't incapacitate 
      it, that enemy operative gains one of your Bleeding tokens (if it 
      doesn't already have one). During a friendly Goremonger operative's 
      activation or counteraction, before or after it performs an action, 
      if it's within 8" of an enemy operative that has one of your Bleeding 
      tokens, you can remove that token and increase that friendly operative's 
      Gore Tank.
    points: []
  
  # --- Inertial Dampener ---
  - id: op_rule_inertial_dampener_3
    name: Inertial Dampener
    type: 
    text: >
      You can ignore any changes to the Hit stat of this operative's Marksman Rail Rifle.
    points: []

  # --- Inspirational Example ---
  - id: op_rule_inspirational_example_3
    name: Inspirational Example
    type: 
    text: >
      Whenever this operative incapacitates an enemy operative, you 
      gain 1 Faith point. 
    points:
      - text: >
          Gain 2 Faith points if that enemy operative had a Wounds 
          stat of 12 or more.
      - text: >
          This rule has no effect when using the Glorious Martyrdom 
          firefight ploy.
  
  # --- Inspirational Pyre ---
  - id: op_rule_inspirational_pyre_3
    name: Inspirational Pyre
    type: 
    text: >
      Once per turning point, when this operative inflicts damage on an 
      enemy operative with either profile of its hand flamer but doesn't 
      incapacitate it, you can use this rule. If you do, you can select 
      one friendly Celestian Insidiant operative within 6" of this 
      operative to become Inspiring.
    points: []
  
  # --- Inspired Strikes ---
  - id: op_rule_inspired_strikes_3
    name: Inspired Strikes
    type: 
    text: >
      Whenever this operative is Inspiring, add 1 to the Critical 
      Dmg stat of weapons on its datacard.
    points: []
  
  # --- Instinctive Behaviour ---
  - id: op_rule_instinctive_behaviour_3
    name: Instinctive Behaviour
    type: 
    text: >
      Whenever this operative is shooting against, fighting against or retaliating 
      against a wounded enemy operative, or an enemy operative that performed the 
      Fall Back action during this turning point, this operative's weapons have 
      the Lethal 5+ weapon rule.
    points: []
  
  # --- Instinctive Predator ---
  - id: op_rule_instinctive_predator_3
    name: Instinctive Predator
    type: 
    text: >
      This operative cannot perform any actions other than Charge, 
      Dash, Fall Back, Fight, Guard and Reposition.
    points:
      - text: >
          It cannot use any weapons that aren't on its datacard.
      - text: >
          This operative can perform the Charge action while it 
          has a Conceal order.
  
  # --- Intrepid ---
  - id: op_rule_intrepid_3
    name: Intrepid
    type: 
    text: >
      Whenever you spend a Resourceful point for this operative, the following 
      take precedence; if you add 1 to its APL stat, it lasts until the start of its next 
      activation instead, and if it regains lost wounds, it regains up to 4 instead.
    points: []

  # --- Irrepressible Hardiness ---
  - id: op_rule_irrepressible_hardiness_3
    name: Irrepressible Hardiness
    type: 
    text: >
      If this operative is incapacitated during the Fight action, you can 
      strike the enemy operative in that sequence with one of your unresolved successes 
      before this operative is removed from the killzone.
    points: []

  # --- I've Got It ---
  - id: op_rule_ive_got_it_3
    name: I've Got It
    type: 
    text: >
      Once during each of this operative's activations, 
      it can perform a mission action for 1 less AP.
    points: []

  # --- Jump Pack ---
  - id: op_rule_jump_pack_3
    name: Jump Pack
    type: 
    text: >
      Whenever this operative performs an action in which it moves, it can Fly. 
      If it does, don't move it. Instead, remove it from the killzone and set it back up 
      wholly within a distance equal to its Move stat (or 3" if it was a Dash) of its original 
      location, measuring the horizontal distance only (in a killzone that uses the close 
      quarters rules, e.g. Killzone: Gallowdark, this distance cannot be measured over or through 
      Wall terrain, and that operative cannot be set up on the other side of an access point, in other 
      words it cannot Fly through an open hatchway). Note that it gains no additional distance when 
      performing the Charge action. It must be set up in a location it can be placed, and unless it's 
      the Charge action, it cannot be set up within control range of an enemy operative.
    points: []
  
  # --- Khorne's Favour ---
  - id: op_rule_khorne_s_favour_3
    name: Khorne's Favour
    type: 
    text: >
      Once during each of this operativ's activations, before or 
      after it performs an action, if its GGore Tank is empty, you 
      can increase its GORE TANK.
    points: []
  
  # --- Kompetitive Streak ---
  - id: op_rule_kompetitive_streak_3
    name: Kompetitive Streak
    type: 
    text: >
      Once per Shoot action, if this operative shoots an enemy operative that another 
      friendly operative has already shot during this turning point, you gain 1 Wrecka 
      point. Determine this when you select a valid target, but you can include any 
      secondary targets when doing so (e.g. from the Blast weapon rule).
    points: []

  # --- Lead the Performance ---
  - id: op_rule_lead_the_performance_3
    name: Lead the Performance
    type: Strategic Gambit
    text: >
      Once per battle, if this operative is in the killzone, change the Allegory you 
      selected for your kill team. Note that the Accolade rule friendly operatives 
      have will also change.
    points: []

  # --- Leystalker Upgrades ---
  - id: op_rule_leystalker_upgrades_3
    name: Leystalker Upgrades
    type: 
    text: >
      When this operative is selected for the battle, select up to 
      two different Leystalker Upgrade rules (see Faction Rules) 
      to be added to its datacard for the battle.
    points: []
  
  # --- Luck of the Laughing God ---
  - id: op_rule_luck_of_the_laughing_god_3
    name: Luck of the Laughing God
    type: 
    text: >
      Once per turning point, you can use this rule. If you do, you can use a firefight 
      ploy for 0CP if this is the specified Void-dancer Troupe operative (including 
      Command Re-roll if the attack or defence dice was rolled for this operative). 
      You cannot select the same firefight ploy for this rule more than once per battle.
    points: []

  # --- Lupine Guile ---
  - id: op_rule_lupine_guile_3
    name: Lupine Guile
    type: 
    text: >
      Once per battle, after rolling off to decide initiative, 
      if this operative is in the killzone, you can re-roll your dice.
    points: []
  
  # --- Machine ---
  - id: op_rule_machine_3
    name: Machine
    type: 
    text: >
       This operative cannot perform any actions other than Dash, 
       Fall Back, Reposition and Shoot. It cannot retaliate, assist 
       in a fight or use any weapons that aren't on its datacard.
    points: []
  
  # --- Machine (C.A.T. Unit) ---
  - id: op_rule_machine_cat_unit_3
    name: Machine
    type: 
    text: >
       This operative cannot perform any actions other than 
       Charge, Dash, Fall Back, Reposition, and Spot.
    points: 
      - text: >
          This operative cannot be activated or perform 
          actions if it's within control range of an 
          enemy operative, or if a friendly Imperial Navy 
          Breacher Surveyor operative has been incapacitated. 
      - text: >
          The turning point can end even if this 
          operative is still ready.
      - text: >
          It cannot retaliate, assist in a fight, 
          climb or jump.
      - text: >
          Whenever determining control of a marker, 
          treat this operative's APL stat as 1 lower. 
          Note this isn't a change to its APL stat, 
          so any changes are cumulative with this.
      - text: >
          Whenever this operative has a Conceal 
          order and is in cover, it cannot be 
          selected as a valid target, taking 
          precedence over all other rules except 
          being within 2".
      - text: >
          Whenever determining what's visible to 
          this operative, draw the line from any 
          part of the miniature.
  
  # --- Machine (Gheistskull) ---
  - id: op_rule_machine_gheistskull_3
    name: Machine (Gheistskull)
    type: 
    text: >
       This operative cannot perform any actions other than Boost, 
       Charge, Dash, Fall Back, and Reposition.
    points: 
      - text: >
          It cannot retaliate or assist in a fight.
      - text: >
          Whenever determining control of a marker, treat 
          this operative's APL stat as 1 lower. Note this 
          isn't a change to its APL stat, so changes are 
          cumulative with this.
      - text: >
          Whenever this operative has a Conceal order and 
          is in cover, it cannot be selected as a valid 
          target, taking precedence over all other rules 
          except being within 2".
  
  # --- Mandiblasters ---
  - id: op_rule_mandiblasters_3
    name: Mandiblasters
    type: 
    text: >
      Whenever this operative performs the Fight action, at the start of the Roll 
      Attack Dice step, you can use this rule. If you do, inflict 2 damage on the 
      enemy operative in that sequence.
    points: []
  
  # --- Markerlight ---
  - id: op_rule_markerlight_3
    name: Markerlight
    type: 
    text: >
      Whenever an enemy operative is a valid target for this operative, or is visible to this 
      operative and within 2" of your Ambush marker (see Prepare Ambush strategy ploy), it's marked. 
      Whenever a friendly XV26 Stealth Battlesuit operative is shooting an operative that's marked, 
      that friendly operative's ranged weapons have the Severe weapon rule. Note that an operative 
      can be a valid target for this operative even if this operative isn't the active operative.
    points: []

  # --- Mechanosuture Array ---
  - id: op_rule_mechanosuture_array_3
    name: Mechanosuture Array
    type: 
    text: >
      Once per turning point, when another friendly Battleclade operative 
      would be incapacitated while visible to and within 3" of this 
      operative, you can use this rule, providing neither this nor that 
      operative is within control range of an enemy operative. If you do, 
      that friendly operative isn't incapacitated, has 1 wound remaining 
      and cannot be incapacitated for the remainder of the action. After 
      that action, that friendly operative can immediately perform a free 
      Dash action, but must end that move within this operative's control 
      range. If this rule was used during that friendly operative's 
      activation, that activation ends. You cannot use this rule if this 
      operative is incapacitated, or if it's a Shoot action and this 
      operative would be a primary or secondary target.
    points: []
  
  # --- Medic! (Hearthkyn Salvager) ---
  - id: op_rule_medic_hearthkyn_salvager_3
    name: Medic! (Hearthkyn Salvager)
    type: 
    text: >
      The first time during each turning point that another friendly Hearthkyn Salvager 
      operative would be removed from the killzone as incapacitated while 
      visible to and within 3" of this operative, you can use this rule, providing 
      neither this nor that operative is within control range of an enemy operative. 
      If you do, that friendly operative isn't incapacitated and has 1 wound 
      remaining. That friendly operative can then immediately perform a free Dash 
      action, but must end that move within this operative's control range. Subtract 
      1 from this and that operative's APL stats until the end of their next 
      activations respectively, and if this rule was used during that friendly 
      operative's activation, that activation ends. You cannot use this rule if 
      this operative is incapacitated.
    points: []
  
  # --- Medic! (Novitiate) ---
  - id: op_rule_medic_novitiate_3
    name: Medic! (Novitiate)
    type: 
    text: >
      The first time during each turning point that another friendly 
      Novitiate operative would be incapacitated while visible to and 
      within 3" of this operative, you can use this rule, providing 
      neither this nor that operative is within control range of an 
      enemy operative.
    points: 
      - text: >
          Target friendly operative isn't incapacitated, has 1 wound 
          remaining and cannot be incapacitated for the remainder of 
          the action.
      - text: >
          After that action, target friendly operative can immediately 
          perform a free Dash action, but must end that move within this 
          operative's control range.
      - text: >
          Subtract 1 from this and that operative's APL stats until the 
          end of their next activations respectively, and if this rule 
          was used during that friendly operative's activation, that 
          activation ends.
      - text: >
          You cannot use this rule if this operative is incapacitated, 
          or if it's a Shoot action and this operative would be a primary 
          or secondary target.

  # --- Militant Faith ---
  - id: op_rule_militant_faith_3
    name: Militant Faith
    type: 
    text: >
      Whenever this operative is shooting, fighting or retaliating, if you use 
      an Act of Faith during that sequence and an enemy operative is incapacitated, 
      the Faith points spent on that Act of Faith are refunded.
    points:
      - text: >
          If you are using the Icon of Faith equipment, Faith points are 
          only refunded for one Act of Faith of your choosing.
  
  # --- Minefield ---
  - id: op_rule_minefield_3
    name: Minefield
    type: 
    text: >
      You have five Minefield markers for the battle. On the reverse side, three of 
      them are HY-Pex mines (see right) and two are blank. Set up all your Minefield 
      markers as if they were one item of equipment. Each must be set up reverse-side 
      down (their specifics aren't revealed), more than 2" from other markers, 
      access points and Accessible terrain, and more than 6" from your opponent's 
      drop zone and your other Minefield markers. Whenever this operative is readied, 
      if it's not within control range of enemy operatives, you can reset one of 
      your flipped Minefield markers that's within its control range (flip the 
      marker back over again).
    points: []
  
  # --- Modified Vox-casters ---
  - id: op_rule_modified_vox-casters_3
    name: Modified Vox-casters
    type: 
    text: >
      Whenever an enemy operative is within 3" of this operative, 
      your opponent must spend 1 additional AP for that enemy 
      operative to perform the Pick Up Marker and mission actions.
    points: # List: Strings for additional info
      - text: >
          Whenever determining control of a marker, treat the total 
          APL stat of enemy operatives that contest it as 1 lower 
          if at least one of those enemy operatives is within 3" of 
          this operative. Note this isn't a change to the APL stat, 
          so any changes are cumulative with this.
  
  # --- Multispectrum Sensor Package ---
  - id: op_rule_multispectrum_sensor_package_3
    name: Multispectrum Sensor Package
    type: Support
    text: >
      Once per turning point, when an enemy operative visible to and within 8" of this 
      operative is activated, you can use this rule. If you do, each friendly XV26 STEALTH BATTLESUIT 
      operative within 3" of this operative can immediately do one of the following:
    points:
      - text: >
          Perform a free Dash action (in an order of your choice). Change its order.
      - text: >
          Each friendly operative that performs the Dash action cannot end that move 
          within 3" of an enemy operative. Note that a Comms Device from universal 
          equipment only affects the second distance of this rule.

  # --- Neuropredatory Crest ---
  - id: op_rule_neuropredatory_crest_3
    name: Neuropredatory Crest
    type: 
    text: >
      Whenever determining control of a marker, treat the total APL stat of enemy 
      operatives that contest it as 1 lower if at least one of those enemy operatives 
      is within 3" of this operative. Note this isn't a change to the APL stat, so any 
      changes are cumulative with this. Whenever an enemy operative is within 3" of 
      this operative:
    points:
      - text: >
          Your opponent must spend 1 additional AP for that enemy operative 
          to perform the Pick Up Marker and mission actions.
      - text: > 
          Your opponent cannot re-roll their attack or defence dice for that operative.
  
  # --- Neutron Fallout ---
  - id: op_rule_neutron_fallout_3
    name: Neutron Fallout
    type: 
    text: >
      Once during each enemy operative's activation, as soon as it's within 2" of 
      one of your Neutron Fallout markers, inflict D3 damage on that operative 
      (multiple markers aren't cumulative).
    points: []

  # --- Null Field ---
  - id: op_rule_null_field_3
    name: Null Field
    type: 
    text: >
       This operative starts the battle with a null range of 1". Whenever an 
       enemy operative is within null range of this operative, subtract 2" 
       from their Move stat, and worsen their weapons Hit stat by 1.
    points:
      - text: > # String: Description of what this option does
          This is not cumulative with being injured.
  
  # --- Null Rod ---
  - id: op_rule_null_rod_3
    name: Null Rod
    type: 
    text: 
    points:
      - text: >
          Psychic ranged weapons cannot inflict damage on this operative.
      - text: >
          For the effects of Psychic actions, this operative cannot be 
          selected and is never treated as being within those actions' 
          required distances.
      - text: >
          Whenever an operative is within 6" of this operative, that 
          operative cannot perform Psychic actions or use Psychic 
          additional rules.
      - text: >
          Whenever an operative is within 6" of this operative, that 
          operative cannot use Psychic ranged weapons.
      - text: >
          Whenever an operative is within 6" of this operative, Psychic 
          melee weapons have no weapon rules and cannot have Dmg stats 
          higher than 3/4.
  
  # --- Obsessive Bloodlust ---
  - id: op_rule_obsessive_bloodlust_3
    name: Obsessive Bloodlust
    type: 
    text: >
      Once during each of this operative's activations, when this 
      operative ends the Fight action, if it's no longer within control 
      range of enemy operatives, you can use this rule. If you do, it 
      can immediately perform a free Charge action (even if it's already 
      performed the Charge action during that activation), but it cannot 
      move more than 2" during that action. Doing so doesn't prevent it 
      from performing the Charge, Dash or Reposition action afterwards 
      during that activation.
    points: []
  
  # --- One Step Ahead ---
  - id: op_rule_one_step_ahead_3
    name: One Step Ahead
    type: 
    text: >
      Once per battle, after an enemy operative performs an action during its 
      activation, if this operative is ready, you can use this rule. If you do, 
      roll one D6: if the result is higher than that enemy operative's APL stat, 
      you can interrupt that activation and immediately perform either a free Shoot 
      or a free Fight action with this operative, but you cannot select any other 
      enemy operative as a valid target or to fight against during that action 
      [note that secondary targets from the Blast weapon rule can still be targeted]. 
      After you perform that action, subtract 1 from this operative's APL stat 
      until the end of its next activation.
    points: []

  # --- Oubliex ---
  - id: op_rule_oubliex_3
    name: Oubliex
    type: 
    text: >
      Whenever this operative is readied, or if this operative 
      incapacitates an enemy operative with its huskblade, its 
      oubliex becomes active. Whenever its oubliex is active and 
      an attack dice would inflict damage on this operative, you 
      can roll one D6.
    points:
      - text: >
          On a 5+, ignore the damage inflicted from that attack dice 
          and its oubliex is no longer active.
  
  # --- Outright Conviction ---
  - id: op_rule_outright_conviction_3
    name: Outright Conviction
    type: 
    text: >
      The first time this operative would be incapacitated during the battle, it's 
      not incapacitated, has 1 wound remaining and cannot be incapacitated for the 
      remainder of the action. All remaining attack dice are discarded (including 
      yours if this operative is fighting or retaliating).
    points: []

  # --- Pan Spectral Visor ---
  - id: op_rule_pan_spectral_visor_3
    name: Pan Spectral Visor
    type: 
    text: >
      Whenever this operative is shooting an operative within 6" of it; this 
      operative's weapons have the Seek Light weapon rule and that operative 
      cannot be obscured.
    points: []

  # --- Part Collector ---
  - id: op_rule_part_collector_3
    name: Part Collector
    type: 
    text: >
      Whenever an enemy operative performs the Fall Back action while within 
      control range of this operative, you can use this rule. If you do, inflict 
      2D3 damage on that enemy operative before it moves.
    points: []
  
  # --- Path to Damnation ---
  - id: op_rule_path_to_damnation_3
    name: Path to Damnation
    type: 
    text: >
      This operative starts the battle with 1 Damnation point. Once per action, 
      you can attempt to use one Boon of Damnation when it specifies (see right). 
      If you do, roll one D6 and compare the result to the number of Damnation 
      points this operative has; if the result is:
    points:
      - text: >
          Higher: Resolve the rule, then this operative gains 1 
          Damnation point.
      - text: >
          Equal: Do not resolve the rule.
      - text: >
          Less: Inflict damage on this operative equal to its 
          number of Damnation points and do not resolve the rule.
      - text: >
          If this operative has 6 Damnation points, resolve the 
          rule without rolling. Note that you cannot make an attempt 
          more than once per action, regardless of the D6 result.
  
  # --- Path to Glory ---
  - id: op_rule_path_to_glory_3
    name: Path to Glory
    type: 
    text: >
      Whenever this operative incapacitates an enemy operative that 
      has your Challenge token, you gain 1CP.
    points: []
  
  # --- Pinned Prey ---
  - id: op_rule_pinned_prey_3
    name: Pinned Prey
    type: 
    text: >
      Whenever an enemy operative would perform the Fall Back action 
      while within control range of this operative, if no other enemy 
      operatives are within this operative's control range, you can use 
      this rule. If you do, roll two D6, or one D6 if that enemy operative 
      has a higher Wounds stat than this operative. If any result is a 4+, 
      that enemy operative cannot perform that action during that 
      activation/counteraction (no AP are spent on it).
    points: []
  
  # --- Pounce ---
  - id: op_rule_pounce_3
    name: Pounce
    type: Strategic Gambit
    text: >
      If this operative's APL stat is 2 or more, this operative can 
      perform a free Charge, Fall Back or Reposition action.
    points:
      - text: >
          Once per battle.
      - text: >
          If it does, until the end of its next activation, 
          subtract 1 from its APL stat and it cannot perform 
          any of the aforementioned actions.
  
  # --- Pox Bomb ---
  - id: op_rule_pox_bomb_3
    name: Pox Bomb
    type: 
    text: >
      This operative can use stun grenades. Doing so doesn't count towards any 
      limited uses you have (i.e. if you also select that grenade from equipment 
      for other operatives). Whenever an enemy operative takes a stun test as a 
      result of this operative performing the Stun Grenade action, if the result 
      is a 3+, also inflict damage on that enemy operative equal to the dice 
      result halved (rounding up).
    points: []
  
  # --- Preternatural Evasion ---
  - id: op_rule_preternatural_evasion_3
    name: Preternatural Evasion
    type: 
    text: >
      Whenever this operative performs the Charge, Fall Back or Reposition action, 
      if it ends that action more than 2" from its previous location, it has Speed 4+; 
      if it ends more than 5" from its previous location, it has Speed 7+ instead.
    points:
      - text: >
          Whenever this operative ends its activation, if it didn't gain Speed 4+ 
          or Speed 7+ during that activation, it has Speed 3-.
      - text: >
          Note that it's the distance from the previous location, not the 
          distance moved (in other words it cannot just circle back to its 
          previous location and gain high Speed).
  
  # --- Proximity Mine ---
  - id: op_rule_proximity_mine_3
    name: Proximity Mine
    type: 
    text: >
       The first time your Haywire Mine marker is within another operative's 
       control range, remove that marker, subtract 1 from that operative's 
       APL stat until the end of its next activation, and inflict 2D3+3 damage 
       on it.
    points:
      - text: >
          Inflict D3+6 if that marker is within 6" horizontally of 
          your Storm marker.
      - text: >
          If the operative isn't incapacitated, end its action (if any), 
          even if that action's effects aren't fulfilled.
      - text: >
          If it cannot be placed, move it the minimum amount to do so.
      - text: >
          Note that this operative is ignored for these effects, meaning 
          it cannot set it off or take damage from that marker.
  
  # --- Purge With Flame ---
  - id: op_rule_purge_with_flame_3
    name: Purge With Flame
    type: 
    text: >
      Once per turning point, you can use the Inferno firefight ploy for 0CP 
      if this is the specified friendly Novitiate operative.
    points: []
  
  # --- Quick Draw ---
  - id: op_rule_quick_draw_3
    name: Quick Draw
    type: 
    text: >
      Once per turning point, when an enemy operative is performing the Shoot action 
      and this operative is selected as the valid target (or if it will be a 
      secondary target from the Blast weapon rule), if this operative is ready, 
      you can interrupt that action to use this rule. If you do, this operative 
      can immediately perform a free Shoot action with its dual Kroot pistols 
      (focused) against that enemy operative (you can change its order to Engage 
      to do so), but that enemy operative must be a valid target.
    points: []

  # --- Quick on the Trigger ---
  - id: op_rule_quick_on_the_trigger_3
    name: Quick on the Trigger
    type: 
    text: >
      This operative can perform the Shoot action while within control range of an 
      enemy operative. If it does, when selecting a valid target, you can only 
      select an enemy operative within this operative's control range, and can do 
      so even if other friendly operatives are within that enemy operative's 
      control range.
    points: []

  # --- Rapid Insertions ---
  - id: op_rule_rapid_insertions_3
    name: Rapid Insertions
    type: Strategic Gambit
    text: >
      In the first turning point, each friendly Tempestus Aquilon Trooper 
      operative wholly within your drop zone can immediately perform a free 
      Reposition action, but must end that move wholly within 3" of your drop zone.
    points: []
  
  # --- Ready for Anything ---
  - id: op_rule_ready_for_anything_3
    name: Ready for Anything
    type: 
    text: >
      Once per turning point, during a friendly Warrior operative's activation, 
      you can use the Meat, Piercing Shot or Toxin Shot rule (see faction equipment) 
      for that operative. Doing so doesn't count for its once per turning point limit.
    points: []

  # --- Reckless Temperament ---
  - id: op_rule_reckless_temperament_3
    name: Reckless Temperament
    type: 
    text: >
      Normal Dmg of 4 or more inflicts 1 less damage on this operative; if this 
      operative has an Engage order, Critical Dmg of 4 or more also inflicts 
      1 less damage on this operative.
    points: []

  # --- Reinforced Carapace ---
  - id: op_rule_reinforced_carapace_3
    name: Reinforced Carapace
    type: 
    text: >
      Normal and Critical Dmg of 4 or more inflicts 1 less damage on this operative.
    points: []
  
  # --- Relic Seeker ---
  - id: op_rule_relic_seeker_3
    name: Relic Seeker
    type: 
    text: >
      Once during each of this operative's activations, it can 
      perform the Pick Up Marker, Place Marker, or a mission 
      action for 1 less AP.
    points: []
  
  # --- Repulsive Fortitude ---
  - id: op_rule_repulsive_fortitude_3
    name: Repulsive Fortitude
    type: 
    text: >
      Whenever an operative is shooting this operative, 
      defence dice results of 5+ are critical successes.
    points: []
  
  # --- Rooftop Stalker ---
  - id: op_rule_rooftop_stalker_3
    name: Rooftop Stalker
    type: 
    text: >
      Whenever this operative is fighting during an activation in 
      which it dropped from Vantage terrain, or whenever this operative 
      is fighting against an enemy operative that's on Vantage terrain, 
      this operative's melee weapons have the Relentless weapon rule.
    points: []
  
  # --- Sagacious ---
  - id: op_rule_sagacious_3
    name: Sagacious
    type: 
    text: >
      At the end of this operative's activation, 
      you can change its order.
    points: []
  
  # --- Savage ---
  - id: op_rule_savage_3
    name: Savage
    type: 
    text: >
      The first time this operative performs the Fight action during 
      each of its activations, if it isn't incapacitated, it can 
      immediately perform a free Fight action afterwards.
    points:
      - text: >
          This takes precedence over action restrictions.
      - text: >
          You cannot use the Ruthless Rampage firefight ploy 
          between the two Fight actions.
      - text: >
          You don't have to select the same enemy operative 
          to fight against.
  
  # --- Savage Assault ---
  - id: op_rule_savage_assault_3
    name: Savage Assault
    type: 
    text: >
      The first time this operative performs the Fight action during each of its 
      activations, if neither it nor the enemy operative in that sequence is 
      incapacitated, this operative can immediately perform a free Fight action 
      afterwards, but you cannot select any other enemy operative to fight against 
      during that action (and only if it's still valid to fight against). This 
      takes precedence over action restrictions.
    points: []

  # --- Scaleshield ---
  - id: op_rule_scaleshield_3
    name: Scaleshield
    type: 
    text: >
      Whenever an operative is shooting this operative, and no attack 
      dice are retained as critical successes, worsen the X of the 
      Piercing weapon rule by 1 (if any).
    points:
      - text: >
          Note that Piercing 1 would therefore be ignored.

  # --- Scuttler (Accelerate) ---
  - id: op_rule_scuttler_accelerate_3
    name: Scuttler (Accelerate)
    type: 
    text: >
      Whenever this operative has a Conceal order and is in cover, it cannot 
      be selected as a valid target, taking precedence over all other rules 
      (e.g. Seek, Vantage terrain) except being within 2".
    points:
      - text: >
          This operative can perform the Fall Back action for 1 less AP.
      - text: >
          This operative cannot use any weapons that aren't on its 
          datacard, or perform unique actions other than Accelerate.
  
  # --- Scuttler (Reanimate) ---
  - id: op_rule_scuttler_reanimate_3
    name: Scuttler (Reanimate)
    type: 
    text: >
      Whenever this operative has a Conceal order and is in cover, it cannot 
      be selected as a valid target, taking precedence over all other rules 
      (e.g. Seek, Vantage terrain) except being within 2".
    points:
      - text: >
          This operative can perform the Fall Back action for 1 less AP.
      - text: >
          This operative cannot use any weapons that aren't on its 
          datacard, or perform unique actions other than Reanimate.
  
  # --- Secure Salvage ---
  - id: op_rule_secure_salvage_3
    name: Secure Salvage
    type: 
    text: >
      Whenever an enemy operative is shooting against, fighting against or 
      retaliating against this operative, if this operative contests an objective 
      marker or one of your mission markers, in the Resolve Attack Dice step, you 
      can subtract 1 from the damage inflicted on it from one success.
    points: []

  # --- Seeker of Divine Arcana ---
  - id: op_rule_seeker_of_divine_arcana_3
    name: Seeker of Divine Arcana
    type: Strategic Gambit
    text: >
      You can immediately change this operative's order and/or it can 
      immediately perform a free Omniscanner, Fall Back, Place Marker, 
      Pick Up Marker, Reposition or mission action. If it's the Fall Back 
      or Reposition action and this operative isn't carrying a marker, it 
      must end that move either within your drop zone (if this isn't possible, 
      then as close as possible to it), or with an objective marker or one of 
      your mission markers within its control range
    points: []
  
  # --- Shadow Portal ---
  - id: op_rule_shadow_portal_3
    name: Shadow Portal
    type: 
    text: >
      Whenever this operative performs the Reposition action using a 
      Shadow Passage, you can use this rule. If you do, remove your 
      Shadow Portal markers from the killzone, then place one of your 
      Shadow Portal markers within this operative's control range before 
      it's removed and one within its control range after it's set up.
    points:
      - text: >
          Each friendly Mandrake operative can use a Shadow Passage 
          each turning point if one of your Shadow Portal markers is 
          within that operative's control range when it's removed, and 
          the other is when it's set up. This takes precedence over one 
          operative once per turning point.
      - text: >
          Friendly operatives can use a Shadow Passage even if this 
          operative has been incapacitated, and doing so doesn't 
          prevent one operative from using a Shadow Passage in 
          the normal manner.
  
  # --- Shadow Warrior ---
  - id: op_rule_shadow_warrior_3
    name: Shadow Warrior
    type: 
    text: >
      Whenever this operative is Within Shadow, add 1 to the 
      Critical Dmg stat of its Glimmersteel Blade.
  
  # --- Shield Generator ---
  - id: op_rule_shield_generator_3
    name: Shield Generator
    type: 
    text: >
      This operative ignores the Piercing weapon rule. Once per turn, when an attack 
      die inflicts Normal Damage on this operative, you can ignore that inflicted 
      damage. You can use Saviour Protocols for 0 CP if this is the specified 
      Drone operative.
    points: []

  # --- Shimmershield ---
  - id: op_rule_shimmershield_3
    name: Shimmershield
    type: 
    text: >
      Whenever an operative is shooting a friendly Blades of Khaine operative that's 
      visible to and within 2" of this operative, ignore the Piercing weapon rule. 
      This operative only has this rule if you select the shimmershield weapon option.
    points: []

  # --- Shokkwave ---
  - id: op_rule_shokkwave_3
    name: Shokkwave
    type: 
    text: >
      Whenever an operative is within x" of your Pulsa marker (see left), worsen 
      the Hit stat of its weapons by 1 and subtract 2" from its Move stat. This 
      is cumulative with being injured. X is that marker's Pulsa points. In the 
      Ready step of each Strategy phase, subtract 1 from your Pulsa marker's 
      points. If a Pulsa marker ever has 0 points, remove it.
    points: []
  
  # --- Simulacrum Nullificatus Icon Bearer ---
  - id: op_rule_simulacrum_nullificatus_icon_bearer_3
    name: Simulacrum Nullificatus Icon Bearer
    type: 
    text: >
      Whenever determining control of a marker, treat the total APL 
      stat of enemy operatives that contest it as 1 lower if at least 
      one of those enemy operatives is within 3" of this operative.
    points:
      - text: >
          This isn't a change to the APL stat, so any changes are 
          cumulative with this.
  
  # --- Slice the Veil ---
  - id: op_rule_slice_the_veil_3
    name: Slice the Veil
    type: 
    text: >
      When setting up this operative before the battle, you can set it up 
      in the warp instead: place it to one side instead of in the killzone. 
      In the first Firefight phase, when this operative is activated, place 
      one of your Warp markers wholly within your territory, then expend 
      this operative
    points: # List: Strings for additional info
      - text: >
          In the second Firefight phase, when this operative is activated, 
          set it up with an order of your choice in a location it can be 
          placed either wholly within your drop zone, or wholly within your 
          territory contesting your Warp marker. Continue its activation as 
          normal, but during that activation it cannot perform more than two 
          actions and cannot use more than 4" of move distance. Until the 
          Ready step of the next Strategy phase, this operative is obscured 
          to operatives more than 3" from it.
      - text: >
          Whenever this operative is in the warp, it cannot be the ready friendly 
          Murderwing operative for the Malicious Narcissism firefight ploy.
  
  # --- Slicing Attack ---
  - id: op_rule_slicing_attack_3
    name: Slicing Attack
    type: 
    text: >
      Whenever this operative performs the Reposition action with a warp jump (see 
      other side of card), you can use this rule. If you do, after it moves, draw 
      an imaginary line 1mm in diameter and up to 7" long between it and its 
      previous location. Note this doesn't have to be a straight line. Inflict 
      D3+2 damage on one enemy operative that line crosses. You cannot inflict 
      damage on an enemy operative that was not visible to this operative at the 
      start of that action. A 28mm round marker can be temporarily placed 
      underneath this operative before it moves to help determine this.
    points: []

  # --- Small ---
  - id: op_rule_small_3
    name: Small
    type: 
    text: >
      This operative cannot use any weapons that aren't on its datacard, 
      or perform unique actions. Whenever this operative has a Conceal order 
      and is in cover, it cannot be selected as a valid target, taking precedence 
      over all other rules (e.g. Seek, Vantage terrain) except being within 2”.
    points: []
  
  # --- Sneaky Zogger ---
  - id: op_rule_sneaky_zogger_3
    name: Sneaky Zogger
    type: 
    text: >
      This operative cannot have an Engage order. Whenever this operative is in cover, 
      it cannot be selected as a valid target, taking precedence over all other 
      rules (e.g. Seek, Vantage terrain) except being within 2".
    points: []

  # --- Sniper's Vantage ---
  - id: op_rule_sniper_vantage_3
    name: Sniper's Vantage
    type: 
    text: >
      Whenever this operative is on Vantage terrain and is shooting an 
      operative that has an Engage order and is at least 2" lower than it, 
      all profiles of its hot-shot long-las have the Severe weapon rule.
    points: []
  
  # --- Soul Harvest ---
  - id: op_rule_soul_harvest_3
    name: Soul Harvest
    type: 
    text: >
      Whenever an enemy operative is incapacitated as a result of this operative's 
      Part Collector rule or baleblade, you gain 1 Soul Harvest point, or two if 
      that enemy operative had an APL stat of 3 or more. Whenever a friendly Mandrake 
      operative is activated, you can spend 1 of your Soul Harvest points to either 
      add 1 to its APL stat until the end of the battle, or have it regain up to 2D3 
      lost wounds.
    points:
      - text: >
          Uou can spend your Soul Harvest points even if this operative is incapacitated.
  
  # --- Spiked Charger ---
  - id: op_rule_spiked_charger_3
    name: Spiked Charger
    type: 
    text: >
      Whenever this operative finishes moving during the Charge action, you can 
      inflict D3 damage on each enemy operative within its control range.
    points:
      - text: >
          Roll separately for each.
  
  # --- Spiritual Chirurgy ---
  - id: op_rule_spiritual_chirurgy_3
    name: Spiritual Chirurgy
    type: 
    text: >
      You can ignore any changes to the stats of friendly Wolf Scout 
      operatives from being injured, including their weapons' stats.
    points:
      - text: >
          This rule excludes Fenrisian Wolf operatives.
      - text: >
          Friendly operatives have this rule if you select this 
          operative for the battle, even if it's incapacitated later.
  
  # --- Spread the Glorious Gifts ---
  - id: op_rule_spread_the_glorious_gifts_3
    name: Spread the Glorious Gifts
    type: Strategic Gambit
    text: >
      Once per battle, select one objective marker this operative controls 
      to gain one of your Techno-curse tokens. It cannot be an objective marker 
      within control range of an enemy operative. Whenever that objective marker 
      is within control range of an enemy operative, that operative is affected 
      by your selected Techno-Curse rule and an additional rule determined by 
      your Techno-Curse, as shown opposite.
    points:
      - text: >
          You cannot use this Strategic Gambit while this operative 
          is within control range of an enemy operative.
      - text: >
          Barrelwarp: No additional effect.
      - text: >
          Screaming Rustspikes: This Techno-Curse inflicts 2 damage 
          on that enemy operative (instead of 1).
      - text: >
          Viral Vox-static: Whenever that enemy operative is activated, 
          subtract 1 from its APL stat until the end of its activation.
  
  # --- Stalker ---
  - id: op_rule_stalker_3
    name: Stalker
    type: 
    text: >
      This operative can perform the Charge action while it has a Conceal order.
    points: []
  
  # --- Steadfast ---
  - id: op_rule_steadfast_3
    name: Steadfast
    type: 
    text: >
      Whenever determining control of a marker, you can treat this operative's 
      APL stat as 3. If you do, this takes precedence over all other rules, 
      meaning any changes to its APL stat are ignored for this.
    points: []
  
  # --- Stonesinger Upgrades ---
  - id: op_rule_stonesinger_upgrades_3
    name: Stonesinger Upgrades
    type: 
    text: >
      When this operative is selected for the battle, select up to two 
      different Stonesinger Upgrade rules (see Faction Rules) to be 
      added to its datacard for the battle.
    points: []
  
  # --- Stoopid ---
  - id: op_rule_stoopid_3
    name: Stoopid
    type: 
    text: >
      In the Firefight phase, whenever you determine this operative's order, you 
      cannot select Conceal. This operative cannot perform any actions other than 
      Charge, Dash, Fight, Reposition and Shoot. It cannot use any weapons that 
      aren't on its datacard.
    points: []

  # --- Storm Shield ---
  - id: op_rule_storm_shield_3
    name: Storm Shield
    type: 
    text: >
      Whenever an operative is shooting this operative, worsen the 
      X of the Piercing weapon rule by 1 (if any).
    points:
      - text: >
          Note that Piercing 1 would therefore be ignored.
  
  # --- Storm-veiled Execution ---
  - id: op_rule_storm-veiled_execution_3
    name: Storm-veiled Execution
    type: 
    text: > # String: Using '>' allows for multi-line descriptions
      Whenever this operative is wholly within your Storm:
    points:
      - text: >
          It can perform the Guard action regardless of the killzone.
      - text: >
          It can perform the Guard action while it has a Conceal order.
  
  # --- Strategic Command ---
  - id: op_rule_strategic_command_3
    name: Strategic Command
    type: 
    text: >
      You can do each of the following once per battle if this operative 
      is in the killzone:
    points:
      - text: >
          Use a Deathwatch strategy ploy for 0CP.
      - text: >
          Use a Deathwatch firefight ploy for 0CP.
  
  # --- Subterranean Ambush ---
  - id: op_rule_subterranean_ambush_3
    name: Subterranean Ambush
    type: 
    text: >
      Once per turning point, after an enemy operative performs an action in which 
      it moves more than 2" and ends within 2" of your Tunnel, if this operative is 
      underground and is either ready or hasn't counteracted during this turning point, 
      you can interrupt that enemy operative's activation/counteraction to use this rule.

      If you do, activate or counteract with this operative (as appropriate), but during 
      its activation/counteraction it must fight against or shoot against that enemy operative, 
      and cannot do so against any other enemy operatives until it does (if this isn't possible, 
      this operative's activation/ counteraction is cancelled and this rule hasn't been used). 
      After completing this operative's activation/counteraction, continue that enemy operative's 
      activation/counteraction (if possible).
    points: []
  
  # --- Swift Landing ---
  - id: op_rule_swift_landing_3
    name: Swift Landing
    type: 
    text: >
      When this operative lands, you can set it up within 
      4" horizontally of one of your Drop markers, taking 
      precedence over the normal distance requirement.
    points: []
  
  # --- Synaptic Link ---
  - id: op_rule_synaptic_link_3
    name: Synaptic Link
    type: Strategic Gambit
    text: >
      If this operative isn't incapacitated, roll one D6 and 
      compare the result to the number of the current turning point. If the result is:
    points:
      - text: >
          Twice as high or higher, you gain 1CP.
      - text: >
          Less, inflict damage on this operative equal to the result.
      - text: >
          Any other result, nothing happens.
  
  # --- Tactician ---
  - id: op_rule_tactician_3
    name: Tactician
    type: Strategic Gambit
    text: >
      Place either your Attack or Defence marker in the killzone. Whenever a friendly 
      Hearthkyn Salvager operative is shooting against, fighting against or retaliating 
      against an enemy operative that's within 3" of your Attack marker, you can re-roll 
      one of your attack dice. Whenever an enemy operative is shooting a friendly Hearthkyn 
      Salvager operative that's within 3" of your Defence marker, you can re-roll one of your 
      defence dice. In the Ready step of the next Strategy phase, remove that marker.
    points: []

  # --- Taktical Wot-notz ---
  - id: op_rule_taktical_wot_notz_3
    name: Taktical Wot-notz
    type: 
    text: >
      You can do each of the following once per turning point: One friendly 
      Kommando Boy operative can perform the Smoke Grenade action. One friendly 
      Kommando Boy operative can perform the Stun Grenade action. The rules for 
      these actions are found in universal equipment. Performing these actions 
      using this rule doesn't count towards their action limits (i.e. if you also 
      select those grenades from equipment).
    points: []

  # --- Tempest's Fury ---
  - id: op_rule_tempests_fury_3
    name: Tempest's Fury
    type: 
    text: >
      Whenever this operative is wholly within your Storm:
    points:
      - text: >
          All profiles of its plasma gun have the Punishing weapon rule.
      - text: >
          Its plasma gun (supercharge) doesn't have the Hot weapon rule.
  
  # --- Tempestus Veteran ---
  - id: op_rule_tempestus_veteran_3
    name: Tempestus Veteran
    type: 
    text: >
      Once per battle, you can either use a firefight ploy for 0CP if this is 
      the specified Tempestus Aquilon operative, or the Command Re-roll firefight 
      ploy for 0CP if this is the operative the attack or defence dice was rolled for.
    points: []
  
  # --- Tentacled Grasp ---
  - id: op_rule_tentacled_grasp_3
    name: Tentacled Grasp
    type: 
    text: >
      Whenever an enemy operative would perform the Fall Back action while 
      within control range of this operative, you can use this rule. If you do, 
      roll one D6, adding 1 to the result if that enemy operative has a Wounds 
      stat of 8 or less: on a 4+, that enemy operative cannot perform that action 
      during that activation/counteraction (the AP spent on it isn't refunded).
    points: []
  
  # --- Thrill of Flight ---
  - id: op_rule_thrill_of_flight_3
    name: Thrill of Flight
    type: 
    text: >
      Whenever this operative does a Boost during its activation:
    points: # List: Strings for additional info
      - text: >
          You can remove any changes to its APL stat.
      - text: >
          You can ignore any changes to its stats from 
          being injured (including its weapons' stats) 
          until the end of the activation..
  
  # --- Toxic Blessings ---
  - id: op_rule_toxic_blessings_3
    name: Toxic Blessings
    type: 
    text: >
      You can ignore any changes to this operative's APL stat and it's not 
      affected by enemy operatives' Shock weapon rule. Whenever an attack dice 
      inflicts Normal Dmg of 3 or more on this operative, roll one D6.
    points:
      - text: >
          On a 5+, subtract 1 from that inflicted damage.
  
  # --- Tracker ---
  - id: op_rule_tracker_3
    name: Tracker
    type: 
    text: >
      Whenever this operative is shooting against or fighting against an expended 
      operative within 6" of it, this operative's weapons have the Punishing weapon rule.
    points: []

  # --- Turret ---
  - id: op_rule_turret_3
    name: Turret
    type: 
    text: >
      This operative can perform two Shoot actions during its activation.
    points: []
  
  # --- Unflinching Example ---
  - id: op_rule_unflinching_example_3
    name: Unflinching Example
    type: 
    text: >
      Whenever this operative incapacitates a ready enemy operative 
      within its control range, you gain 1 Faith point.
    points:
      - text: >
          Gain 2 Faith points if that enemy operative had a Wounds stat of 12 or more.
  
  # --- Unnatural Regeneration ---
  - id: op_rule_unnatural_regeneration_3
    name: Unnatural Regeneration
    type: 
    text: >
      Whenever an attack dice inflicts damage of 3 or more on this operative, 
      roll one D6: on a 5+, subtract 1 from that inflicted damage.
    points: []
  
  # --- Veteran Adventurer ---
  - id: op_rule_veteran_adventurer_3
    name: Veteran Adventurer
    type: 
    text: >
      In the Ready step of each Strategy phase after the first, if this operative 
      isn't within control range of enemy operatives, you gain 1 Resourceful point.
    points: []

  # --- Veteran Raider ---
  - id: op_rule_veteran_raider_3
    name: Veteran Raider
    type: 
    text: >
      This operative can perform a 1AP action for free during their activation as a 
      result of the Aeldari Raiders rule (instead of the Dash action).
    points: []

  # --- Vicious Duellist ---
  - id: op_rule_vicious_duellist_3
    name: Vicious Duellist
    type: 
    text: >
      Whenever this operative is fighting or retaliating, for each attack dice your 
      opponent discards as a fail, inflict 1 damage on the enemy operative in that sequence.
    points: []

  # --- Vicious Knife Fighter ---
  - id: op_rule_vicious_knife_fighter_3
    name: Vicious Knife Fighter
    type: 
    text: >
      Whenever this operative is fighting, after resolving your 
      first attack dice during that sequence, you can immediately 
      resolve another (before your opponent).
    points: []
  
  # --- Victory Shriek ---
  - id: op_rule_victory_shriek_3
    name: Victory Shriek
    type: 
    text: >
      Whenever your mark is incapacitated, you can select one friendly 
      Farstalker Kinbad operative within 6" of this operative. Until the end of 
      the battle, that operative's weapons have the Balanced weapon rule. Each 
      friendly operative can only be selected for this rule once per battle.
    points: []

  # --- Vigilant Marksman ---
  - id: op_rule_vigilant_marksman_3
    name: Vigilant Marksman
    type: 
    text: >
      This operative can perform the Guard action during its activation 
      regardless of the killzone. When using the close quarters rules, 
      once per turning point, after this operative performs a free Shoot 
      action on guard, it can immediately perform a free Guard action. 
      However, if it does, it cannot counteract during that turning point 
      (nor Guard twice if it's counteracted).
    points: []
  
  # --- Virge of Admonition Icon Bearer ---
  - id: op_rule_virge_of_admonition_icon_bearer_3
    name: Virge of Admonition Icon Bearer
    type: 
    text: >
      Whenever determining control of a marker, treat this operative's APL 
      stat as 1 higher.
    points: 
      - text: >
          this is not a change to its APL stat, so any 
          changes are cumulative with this.
  
  # --- War Gong ---
  - id: op_rule_war_gong_3
    name: War Gong
    type: 
    text: >
      Whenever an attack dice would inflict Critical Dmg on a friendly 
      Fellgor Ravager operative within 3" of this operative, if this 
      operative doesn't have one of your Frenzy tokens, you can choose 
      for that attack dice to inflict Normal Dmg instead.
    points: []
  
  # --- Warrior Frenzy ---
  - id: op_rule_warrior_frenzy_3
    name: Warrior Frenzy
    type: 
    text: >
      Whenever this operative has one of your Frenzy tokens, it cannot 
      be injured. This takes precedence over the normal Frenzy rules.
    points: []
  
  # --- Weavefield Crest ---
  - id: op_rule_weavefield_crest_3
    name: Weavefield Crest
    type: 
    text: >
      The first time an attack dice inflicts 4 or more damage on this operative 
      during the battle, ignore that inflicted damage.
    points: []

  # --- Weavewerke Cloak ---
  - id: op_rule_weavewerke_cloak_3
    name: Weavewerke Cloak
    type: 
    text: >
      Whenever an operative is shooting this operative; Ignore the Saturate weapon 
      rule. If you can retain any cover saves, you can retain one additional cover 
      save, or you can retain one cover save as a critical success instead. This 
      isn't cumulative with improved cover saves from Vantage terrain.
    points: []

  # --- Well Supplied ---
  - id: op_rule_well_supplied_3
    name: Well Supplied
    type: 
    text: >
      You can select one additional equipment option.
    points: []

  # --- Whip Control ---
  - id: op_rule_whip_control_3
    name: Whip Control
    type: 
    text: >
      Whenever an enemy operative is visible to and within 3" 
      of this operative, if this operative isn't within control 
      range of any other enemy operatives:
    points:
      - text: >
          ubtract 1 from the Atk stat of that enemy operative's 
          melee weapons (to a minimum of 1).
      - text: >
          Your opponent must spend 1 additional AP for that 
          enemy operative to perform the Fall Back action.
  
  # --- Wrecka Boss ---
  - id: op_rule_wrecka_boss_3
    name: Wrecka Boss
    type: 
    text: >
      Whenever this operative performs the Shoot or Fight action (excluding Guard), 
      you gain 1 Wrecka point.
    points: []

  # --- Wroughtlock Negotiation ---
  - id: op_rule_wroughtlock_negotiation_3
    name: Wroughtlock Negotiation
    type: Strategic Gambit
    text: >
      This operative can immediately perform a free Shoot action 
      (you can change its order to Engage to do so).
    points: []
  
  # --- XV26 Drone Controller ---
  - id: op_rule_xv26_drone_controller_3
    name: XV26 Drone Controller
    type: Strategic Gambit
    text: >
      Whenever this operative is in the killzone, select one friendly XV26 Stealth 
      Battlesuit Drone operative in the killzone. Until the end of that operative's 
      next activation, ignore the first two bullet points of its Drone rule 
      (this takes precedence over that rule).
    points: []
  
  # --- Zealous Ultimatum ---
  - id: op_rule_zealous_ultimatum_3
    name: Zealous Ultimatum
    type: Strategic Gambit
    text: >
      Select one enemy operative within 8" of this operative and issue an 
      ultimatum to it. Your opponent must accept or decline that ultimatum. 
    points:
      - text: >
          Once per battle Strategic Gambit.
      - text: >
          If the ultimatum is accepted, whenever this operative is fighting 
          against or retaliating against that enemy operative, add 1 to the 
          Atk stat of this operative's blessed broadsword.
      - text: >
          The first time this operative incapacitates that enemy operative 
          while fighting or retaliating during the battle, add 1 to the Atk 
          stat of this operative's blessed broadsword until the end of the 
          battle.
      - text: >
          If the ultimatum is declined, whenever that enemy operative is 
          fighting against or retaliating against a friendly Celestian 
          Insidiant operative, subtract 1 from the Atk stat of that enemy 
          operative's weapons.
      - text: >
          If it's a non-player operative, roll one D6. On a 4+, the 
          ultimatum is accepted, otherwise it's declined.
      - text: >
          Atk stat can only be increased to a maximum of 5.