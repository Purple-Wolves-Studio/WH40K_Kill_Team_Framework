actions: # List of operative actions
  # --- Accelerate ---
  - id: op_act_accelerate_3
    name: Accelerate
    cost: 1
    type: 
    text: >
      Select one friendly Deathmark or Immortal operative visible to and 
      within 6" of this operative.
    choices: []
    points:
      - text: >
          Until the end of that operative's next activation, add 1 to 
          its APL stat.
    rules:
      - text: >
          This operative cannot perform this action while within control 
          range of an enemy operative.
  
  # --- Apoplectic Rejuvenation ---
  - id: op_act_apoplectic_rejuvenation_3
    name: Apoplectic Rejuvenation
    cost: 1
    type: 
    text: >
      Select one friendly Fellgor Ravager operative that doesn't have one of 
      your Frenzy tokens and is visible to and within 6" of this operative. 
      That friendly operative regains up to 2D3 lost wounds.
    choices: []
    points:
      - text: >
          If that operative has incapacitated an enemy operative while fighting 
          or retaliating during the battle, it regains up to 6 lost wounds instead.
    rules:
      - text: >
          This operative cannot perform this action while within control range of 
          an enemy operative.
  
  # --- Augment Weapon ---
  - id: op_act_augment_weapon_3
    name: Augment Weapon
    cost: 1
    type: Support
    text: >
      Select one friendly Hierotek Circle operative visible to and within 6" of 
      this operative. Until the start of this operative's next activation, until 
      it's incapacitated or until this action is performed again by a friendly 
      operative (whichever comes first), select two of the following weapon rules 
      for one weapon from that selected operative's datacard to have:
    choices: []
    points:
      - text: >
          Lethal 5+
      - text: >
          Rending
      - text: >
          Saturate
      - text: >
          Severe
    rules:
      - text: >
          This operative cannot perform this action while within control 
          range of an enemy operative.
      - text: >
          Note that if you select a Staff of Light or Arcane Conduit, 
          you only select the additional weapon rules for either the 
          ranged or melee profile of that weapon.
  
  # --- Auspex Scan ---
  - id: op_act_auspex_scan_3
    name: Auspex Scan
    cost: 1
    type:
    text: >
      Until the start of this operative's next activation or until it's incapacitated 
      (whichever comes first), whenever a friendly Scout Squad operative is shooting an 
      enemy operative within 8" of this operative, that enemy operative cannot be obscured; 
      if that friendly operative is a Sniper that's currently benefitting from the effects 
      of its Optics action, its ranged weapons also have the Seek Light weapon rule.
    choices: []
    points: []
    rules:
      - text: >
          This operative cannot perform this action while within control range of an enemy operative.
  
  # --- Auto-Broadcaster ---
  - id: op_act_auto_broadcaster_3
    name: Auto-Broadcaster
    cost: 1
    type: 
    text: >
      If your Auto-Broadcaster marker isn't in the killzone, place it within 8" 
      horizontally of this operative. If it is in the killzone, move your 
      Auto-Broadcaster marker up to 8" horizontally.
    choices: []
    points: []
    rules:
      - text: >
          This operative cannot perform this action while within control range 
          of an enemy operative.
      - text: >
          Whenever an enemy operative within 3" of your Auto-Broadcaster marker 
          is shooting, fighting, or retaliating, your opponent cannot re-roll 
          their attack dice.
      - text: >
          If this operative is removed from the killzone, remove your 
          Auto-Broadcaster marker from the killzone.
  
  # --- Boost ---
  - id: op_act_boost_3
    name: Boost
    cost: 1
    type: 
    text: >
      The next time this operative performs a Charge action during this 
      activation, add 4" to the distance it can move (instead of 2").
    choices: []
    points: []
    rules: # List: Strings for rule info
      - text: >
          This operative cannot perform this action more than 
          once per battle, and cannot perform it during the 
          first turning point.
  
  # --- Breach ---
  - id: op_act_breach_3
    name: Breach
    cost: 1
    type:
    text: >
      Place one of your Breach markers within this operative's control range as 
      close as possible to a terrain feature within control range of it. Whenever 
      an operative is within 1" of that marker, it treats parts of that terrain 
      feature that are no more than 1" thick as Accessible terrain.
    choices: []
    points: []
    rules:
      - text: >
          This operative can perform this action during the Charge or Reposition action, 
          and it can do so for 1 less AP during those actions. Any remaining move distance 
          can be used after it does so. (Not true for Battleclade Breacher Servitor)
      - text: >
          This operative cannot perform this action while within control range of an enemy 
          operative, or if a terrain feature isn't within its control range.
  
  # --- Breach Point ---
  - id: op_act_breach_point_3
    name: Breach Point
    cost: 1
    type: 
    text: >
      Place one of your Breach markers within this operative's control range 
      as close as possible to a terrain feature within control range of it.
    choices: []
    points: # List: Strings for additional info
      - text: >
          Whenever an operative is within 1" of that marker, it 
          treats parts of that terrain feature that are no more 
          than 1" thick as Accessible terrain.
    rules: # List: Strings for rule info
      - text: >
          This operative cannot perform this action while within 
          control range of an enemy operative, or if a terrain 
          feature isn't within its control range.
  
  # --- Break Stuff ---
  - id: op_act_break_stuff_3
    name: Break Stuff
    cost: 1
    type:
    text: >
      Select a terrain feature within this operative's control range. If it's an 
      equipment terrain feature, remove it. Otherwise, place one of your Breach 
      markers within this operative's control range as close as possible to that 
      terrain feature. Whenever an operative is within 1" of that marker, it 
      treats parts of that terrain feature that are no more than 1" thick as 
      Accessible terrain.
    choices: []
    points: []
    rules:
      - text: >
          This operative cannot perform this action while within control range of an enemy 
          operative, or if a terrain feature isn't within its control range.

  # --- Call the Storm ---
  - id: op_act_call_the_storm_3
    name: Call the Storm
    cost: 1
    type: 
    text: >
      Full description of the action goes here. It will be 
      stored as a single long string.
    choices: # List: Use this when an ability has multiple options
      - name: 
        type: Psychic
        text: >
          Remove your Storm marker from the killzone (if any), 
          then place it in the killzone.
      - name: 
        type: Psychic
        text: >
          Select one friendly Wolf Scout operative. Until the start 
          of this operative's next activation, until it's incapacitated 
          or until it performs this action again (whichever comes first), 
          whenever that friendly operative is wholly within your Storm 
          and more than 3" from the active operative, it's obscured.
    points: []
    rules:
      - text: >
          This operative cannot perform this action while within 
          control range of an enemy operative.
  
  # --- Canoptek Repair ---
  - id: op_act_canoptek_repair_3
    name: Canoptek Repair
    cost: 1
    type: Support
    text: >
      Select one friendly Hierotek Circle operative visible to and within 
      6" of this operative to regain up to 2D3 lost wounds.
    choices: []
    points: []
    rules:
      - text: >
          This operative cannot perform this action while within control 
          range of an enemy operative, or if a friendly operative has 
          already performed this action during this turning point.
  
  # --- Carving Blow ---
  - id: op_act_carving_blow_3
    name: Carving Blow
    cost: 1
    type: 
    text: >
      Inflict 2D3 damage on each other operative visible to and within 
      2" of this operative in an order of your choice ().
    choices: []
    points: []
    rules:
      - text: >
          This operative cannot perform this action while it has a Conceal order, 
          or during the same activation in which it performed the Slice from Above 
          action (see Bladefins faction equipment), the Clawed Charge action (see 
          Clawed Armour faction equipment) or two Fight actions (and vice versa).
      - text: >
          Roll separately for each.
  
  # --- Chirurgeon's Tools ---
  - id: op_act_chirurgeons_tools_3
    name: Chirurgeon's Tools
    cost: 1
    type: 
    text: >
      Select one friendly Novitiate operative within this operative's control 
      range to regain up to 2D3 lost wounds.
    choices: []
    points: []
    rules:
      - text: >
          This operative cannot perform this action while within control 
          range of an enemy operative.
      - text: >
          The target cannot be an operative that the Medic! rule was used 
          on during this turning point.
  
  # --- Chronometron ---
  - id: op_act_chronometron_3
    name: Chronometron
    cost: 1
    type: Support
    text: >
      Select one friendly Hierotek Circle operative visible to and within 
      6" of this operative. Until the start of this operative's next 
      activation, until this operative is incapacitated or until this 
      action is performed again by a friendly operative (whichever comes 
      first), subtract 1 from the Atk stat of an operative's weapons whenever 
      it's shooting that selected operative.
    choices: []
    points: []
    rules:
      - text: >
          This operative cannot perform this action while within control 
          range of an enemy operative.
  
  # --- Cleaver Flurry ---
  - id: op_act_cleaver_flurry_3
    name: Cleaver Flurry
    cost: 1
    type: 
    text: >
      Perform a free Reposition action with this operative.
    choices: []
    points:
      - text: >
          During that action, it can move an additional 2", 
          and can move within control range of enemy operatives 
          (it cannot begin or end the move there)
      - text: >
           Inflict D3+1 damage on each enemy operative it 
           moved within control range of (roll separately 
           for each after it's moved, in the order it moved 
           within control range of them).
    rules:
      - text: >
          This operative cannot perform this action while 
          it has a Conceal order.
  
  # --- Command ---
  - id: op_act_command_3
    name: Command
    cost: 1
    type: Support
    text: >
       Select one other friendly Tempestus Aquilon operative (excluding Servo-sentry) 
       visible to and within 6" of this operative. Until the end of that operative's 
       next activation, add 1 to its APL stat.
    choices: []
    points: []
    rules:
      - text: >
          This operative cannot perform this action while within control 
          range of an enemy operative.
  
  # --- Countertemporal Nanomine ---
  - id: op_act_countertemporal_nanomine_3
    name: Countertemporal Nanomine
    cost: 1
    type: 
    text: >
      Place your Countertemporal Nanomine marker visible to and within 8" 
      of this operative, or within 8" of this operative and on Vantage 
      terrain of a terrain feature that's visible to this operative. 
      Whenever an enemy operative is within 4" of your Countertemporal 
      Nanomine marker, subtract 2" from its Move stat. When this operative 
      is next activated, is incapacitated or this action is performed again 
      by a friendly operative (whichever comes first), remove that marker.
    choices: []
    points: []
    rules:
      - text: >
          This operative cannot perform this action while within control 
          range of an enemy operative.
  
  # --- Dakka Dash ---
  - id: op_act_dakka_dash_3
    name: Dakka Dash
    cost: 1
    type:
    text: >
      Perform a free Dash action and a free Shoot action with this operative in any order. 
      You can only select a dakka shoota for that Shoot action.
    choices: []
    points: []
    rules:
      - text: >
          This operative cannot perform this action while it has a Conceal order, or while 
          within control range of an enemy operative.

  # --- Dash and Spray ---
  - id: op_act_dash_and_spray_3
    name: Dash and Spray
    cost: 1
    type: 
    text: >
      Perform a free Dash action and a free Shoot action 
      with this operative in any order. You can only select 
      dual autopistols (focused) for that Shoot action.
    choices: []
    points: []
    rules:
      - text: >
          This operative cannot perform this action while 
          it has a Conceal order, or while within control 
          range of an enemy operative.
  
  # --- Datacoronal Accumulator ---
  - id: op_act_datacoronal_accumulator_3
    name: Datacoronal Accumulator
    cost: 1
    type: Support
    text: >
      Determine the friendly Battleclade operatives within 6" of this operative 
      and/or a friendly Battleclade Auto-proxy operative, then roll one D3. If 
      the result is equal to or less than the number of objective markers those 
      friendly operatives contest, you gain 1CP. For the purposes of the Comms 
      Device universal equipment, the operative the distance is being determined 
      from must control your Comms Device marker to add 3" to its distance 
      requirement for this rule.
    choices: []
    points: []
    rules:
      - text: >
          This operative cannot perform this action while within control range of an enemy operative.
  
  # --- Distend Dorsal Sac ---
  - id: op_act_distend_dorsal_sac_3
    name: Distend Dorsal Sac
    cost: 1
    type: 
    text: >
      Until this operative has shot with its venom bolt, until it performs 
      this action again or until it performs the Burrow action (whichever comes first), 
      all profiles of its venom bolt have the Lethal 5+ weapon rule, have 1 added to 
      their Atk stat and the Range 8" weapon rule removed.
    choices: []
    points: []
    rules: []

  # --- Expedient Repair ---
  - id: op_act_expedient_repair_3
    name: Expedient Repair
    cost: 1
    type: 
    text: >
      Select one friendly Battleclade operative within this operative's 
      control range to regain up to D3+3 lost wounds. It cannot be an 
      operative that the Mechanosuture Array rule was used on during 
      this turning point.
    choices: []
    points: []
    rules:
      - text: > # String: Description of the first rule
          This operative cannot perform this action while within 
          control range of an enemy operative.
  
  # --- Flail ---
  - id: op_act_flail_3
    name: Flail
    cost: 1
    type: 
    text: >
      Inflict D3+2 damage on each other operative that's both visible 
      to and within 2" of this operative. Roll separately for each: 
      if it's an enemy operative, if the D3 result is a 3, that enemy 
      operative also gains one of your Poison tokens (if it doesn't 
      already have one).
    choices: []
    points: []
    rules:
      - text: >
          For the purposes of action restrictions and the Astartes 
          faction rule, this action is treated as a Fight action. 
          This operative cannot perform this action while it has 
          a Conceal order.
  
  # --- Fog of Dreams ---
  - id: op_act_fog_of_dreams_3
    name: Fog of Dreams
    cost: 1
    type: Psychic
    text: >
      Select one ready enemy operative visible to this operative and roll one D6. 
      Until the end of the turning point, that enemy operative cannot be activated or perform actions 
      until it's the last enemy operative to be activated, or until your opponent has activated a number 
      of enemy operatives after this action equal to the result of the D6 (whichever comes first).
    choices: []
    points: []
    rules:
      - text: >
          This operative cannot perform this action while within control range of an enemy operative.

  # --- Gaze of the Omnissiah ---
  - id: op_act_gaze_of_the_omnissiah_3
    name: Gaze of the Omnissiah
    cost: 1
    type: 
    text: >
      Select one enemy operative visible to this operative. Until the 
      end of the turning point, whenever a friendly Battleclade operative 
      is shooting that enemy operative, you can use this effect. If you do:
    choices: []
    points: 
      - text: >
          That friendly operative's ranged weapons have the Seek Light weapon rule.
      - text: >
          That enemy operative cannot be obscured.
    rules:
      - text: >
          This operative cannot perform this action while within control 
          range of an enemy operative.
  
  # --- Get it Dun! ---
  - id: op_act_get_it_dun_3
    name: Get it Dun!
    cost: 1
    type: Support
    text: >
      Select one other friendly Kommando operative (excluding Bomb Squig) 
      visible to and within 6" of this operative. Until the end of that operative's next 
      activation, add 1 to its APL stat.
    choices: []
    points: []
    rules:
      - text: >
          This operative cannot perform this action while within control range of 
          an enemy operative, or while counteracting.

  # --- Gong Knell ---
  - id: op_act_gong_knell_3
    name: Gong Knell
    cost: 1
    type: 
    text: >
      Until the start of this operative's next activation or 
      until this operative is incapacitated (whichever comes first), 
      whenever an operative is shooting this operative, improve this 
      operative's Save stat by 1 and ignore the Piercing weapon rule.
    choices: []
    points: []
    rules: []
  
  # --- Grappling Hook ---
  - id: op_act_grappling_hook_3
    name: Grappling Hook
    cost: 1
    type:
    text: >
      Select a visible point on a terrain feature for this operative. Remove this operative 
      from the killzone and set it back up within 1" horizontally of that point in a location it can be 
      placed, not within control range of enemy operatives, and with that point visible to it. This 
      operative cannot perform the Operate Hatch action during this action.
    choices: []
    points: []
    rules:
      - text: >
          This action is treated as a Reposition action. This operative cannot perform this 
          action while within control range of an enemy operative, or during an activation in which it 
          performed the Charge or Fall Back action (or vice versa).
  
  # --- Harbinger of Despair ---
  - id: op_act_harbinger_of_despair_3
    name: Harbinger of Despair
    cost: 1
    type: 
    text: 
    choices: # List: Use this when an ability has multiple options
      - name: 
        type: 
        text: >
          Place your Despair marker visible to this operative, or on Vantage terrain 
          of a terrain feature that's visible to this operative. When this operative 
          is next activated, is incapacitated or this action is performed again by a 
          friendly operative (whichever comes first), remove that marker.
      - name: 
        type: 
        text: >
          Whenever an enemy operative is within 2" of your Despair marker, your 
          opponent must spend 1 additional AP for that enemy operative to perform 
          the Pick Up Marker and mission actions. Whenever determining control of 
          a marker, treat the total APL stat of enemy operatives that contest it 
          as 1 lower if at least one of those enemy operatives is within 2" of your 
          Despair marker. Note this isn't a change to the APL stat, so any changes 
          are cumulative with this.
    points: []
    rules:
      - text: >
          This operative cannot perform this action while within control 
          range of an enemy operative.
  
  # --- Healing Balms ---
  - id: op_act_healing_balms_3
    name: Healing Balms
    cost: 1
    type: 
    text: >
      Select one friendly Wolf Scout operative within this operative's 
      control range to regain up to D3+3 lost wounds.
    choices: []
    points: []
    rules:
      - text: >
          This operative cannot perform this action while within control 
          range of an enemy operative.
      - text: >
          This operative cannot perform this action more than once 
          per turning point.
  
  # --- Heinous Deluge ---
  - id: op_act_heinous_deluge_3
    name: Heinous Deluge
    cost: 1
    type: Psychic
    text: >
      Select one enemy operative that's a valid target for 
      this operative. Until the end of that operative's next 
      activation, subtract 1 from its APL stat.
    choices: []
    points: []
    rules:
      - text: >
          This operative cannot perform this action while within 
          control range of an enemy operative.
  
  # --- Hunter's Senses ---
  - id: op_act_hunters_senses_3
    name: Hunter's Senses
    cost: 1
    type: 
    text: >
      Select one of the following rules for this operative's instigator 
      bolt carbine to have until the start of its next activation:
    choices: # List: Use this when an ability has multiple options
      - name: Severe
        type: 
        text: >
          This weapon has the Severe weapon rule.
      - name: Saturate
        type: 
        text: >
          This weapon has the Saturate weapon rule. Whenever this 
          operative is shooting, enemy operatives cannot be obscured.
    points: []
    rules:
      - text: >
          This operative cannot perform this action while within 
          control range of an enemy operative.
  
  # --- Incite Fury ---
  - id: op_act_incite_fury_3
    name: Incite Fury
    cost: 1
    type: Support
    text: >
      Select one other friendly Fellgor Ravager operative 
      (excluding Shaman or Ironhorn) visible to and within 3" 
      of this operative. Until the end of that operative's next 
      activation, add 1 to its APL stat.
    choices: []
    points: []
    rules:
      - text: >
          This operative cannot perform this action while 
          within control range of an enemy operative.
  
  # --- Incite Slaughter ---
  - id: op_act_incite_slaughter_3
    name: Incite Slaughter
    cost: 1
    type: Support
    text: >
      One other friendly Chaos Cult operative visible to and within 9" 
      of this operative can immediately perform a free Fight action.
    choices: []
    points: []
    rules:
      - text: >
          This operative cannot perform this action while within control 
          range of an enemy operative

  # --- Incite Urgency ---
  - id: op_act_incite_urgency_3
    name: Incite Urgency
    cost: 1
    type: Support
    text: >
      One other friendly Chaos Cult operative visible to and within 9" 
      of this operative can immediately perform a free Charge or Dash 
      action (for the former, it cannot move more than 3").
    choices: []
    points: []
    rules:
      - text: >
          This operative cannot perform this action while within control 
          range of an enemy operative
  
  # --- Interference Pulse ---
  - id: op_act_interference_pulse_3
    name: Interference Pulse
    cost: 1
    type: 
    text: >
      Select one enemy operative visible to and within 8" of a 
      friendly Gheistskull operative. Roll one D6, adding 1 to 
      the result if that enemy operative is a valid target for 
      that friendly Gheistskull operative.
    choices: []
    points: # List: Strings for additional info
      - text: >
          On a 3+, subtract 1 from that enemy operative's APL 
          stat until the end of its next activation.
    rules: # List: Strings for rule info
      - text: >
          This operative cannot perform this action while within 
          control range of an enemy operative, or if a friendly 
          Gheistskull operative isn't in the killzone.
  
  # --- Interstitial Command ---
  - id: op_act_interstitial_command_3
    name: Interstitial Command
    cost: 1
    type: Support
    text: >
      Select one other friendly Hierotek Circle operative visible to and 
      within 6" of this operative. That selected operative can immediately 
      perform a 1AP action for free.
    choices:  []
    points: []
    rules:
      - text: >
          Excludes Aprentek and Cryptek operatives.
      - text: >
          Excludes the Accelerate action.
      - text: >
          It cannot move more than or be removed and 
          set up more than 2" during that action.
      - text: >
          It cannot perform an action it's already 
          performed during this turning point.
      - text: >
          It cannot perform that action again during 
          this turning point.
  
  # --- Listen In ---
  - id: op_act_listen_in_3
    name: Listen In
    cost: 1
    type: Support
    text: >
      Select one other friendly Kommando operative (excluding Bomb Squig) 
      visible to and within 6" of this operative. Until the end of that operative's next 
      activation, add 1 to its APL stat.
    choices: []
    points: []
    rules:
      - text: >
          This operative cannot perform this action while within control range of an enemy operative.

  # --- Malefic Vortex ---
  - id: op_act_malefic_vortex_3
    name: Malefic Vortex
    cost: 1
    type: Psychic
    text: >
      Remove your Malefic Vortex marker from the killzone (if any). 
      Then place your Malefic Vortex marker visible to this operative, 
      or on Vantage terrain of a terrain feature that's visible to this 
      operative. Inflict 1 damage on each enemy operative within 2" of 
      that marker. In addition, in the Ready step of each Strategy phase, 
      inflict 1 damage on each enemy operative within 2" of that marker.
    choices: []
    points: []
    rules:
      - text: >
          This operative cannot perform this action while within 
          control range of an enemy operative.
  
  # --- Mantle of Darkness ---
  - id: op_act_mantle_of_darkness_3
    name: Mantle of Darkness
    cost: 1
    type: Psychic
    text: >
      Until the start of this operative's next activation or until it's 
      incapacitated (whichever comes first), whenever a friendly Fellgor 
      Ravager operative is visible to and within 3" of this operative, 
      has a Conceal order and is in cover, that friendly operative cannot 
      be selected as a valid target, taking precedence over all other rules 
      (e.g. Seek, Vantage terrain) except being within 2".
    choices: []
    points: []
    rules:
      - text: >
          This operative cannot perform this action while within control 
          range of an enemy operative.
  
  # --- Mirror of Minds ---
  - id: op_act_mirror_of_minds_3
    name: Mirror of Minds
    cost: 1
    type: Psychic
    text: >
      Select one enemy operative that's a valid target for and within 8" of 
      this operative. Both players roll five D6. Pair your dice with your opponent's dice based on 
      matching results. For each matching pair, inflict D3 damage on that enemy operative [to a 
      maximum of 8]. For example, if you rolled 6, 5, 5, 2, 1 and your opponent rolled 6, 5, 4, 3, 1, 
      you would inflict 3D3 damage on that enemy operative.
    choices: []
    points: []
    rules:
      - text: >
          This operative cannot perform this action while within control range of an enemy operative.
  
  # --- Multi-Dimensional Vision ---
  - id: op_act_multi-dimensional_vision_3
    name: Multi-Dimensional Vision
    cost: 1
    type: 
    text: >
      Until the start of this operative's next activation, whenever it's shooting, 
      enemy operatives cannot be obscured.
    choices: []
    points: []
    rules:
      - text: >
          This operative cannot perform this action while within control 
          range of an enemy operative.
  
  # --- Network Override ---
  - id: op_act_network_override_3
    name: Network Override
    cost: 1
    type: Support
    text: >
      Select one friendly Battleclade Servitor operative within 6" of either 
      this operative or a friendly Battleclade Auto-proxy operative to immediately 
